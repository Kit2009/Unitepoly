<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲大螢幕 (Display)</title>
    <style>
        :root {
            --primary-bg: #cdeaf7;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --border-color: #000;
            --text-dark: #1f2937;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --select-yellow: #facc15;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            background-image: radial-gradient(circle, #e0f2fe 0%, #bae6fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: var(--text-dark);
        }

        .container {
            width: 100%;
            max-width: 1300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 📌 1. 頂部資訊欄 */
        .top-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: 80px;
        }

        .status-card {
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            border: 3px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .status-item .title { font-size: 1rem; color: #4b5563; font-weight: bold; }
        .status-item .value { font-size: 2.2rem; font-weight: 800; color: #111827; }

        /* 📌 2. 玩家數據欄 */
        .player-bar {
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 12px 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 1.3rem;
            font-weight: bold;
            border: 3px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .val-green { color: var(--accent-green); font-size: 1.5em; font-weight: 800; }
        .val-orange { color: var(--accent-orange); font-size: 1.4em; font-weight: 800; }

        /* 📌 3. 主區域（棋盤與資訊面板） */
        .main-layout {
            display: grid;
            grid-template-columns: minmax(450px, 1.3fr) 380px;
            gap: 20px;
        }

        /* 棋盤 */
        .board {
            background: #fff;
            border: 4px solid var(--border-color);
            border-radius: 20px;
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(11, 1fr);
            padding: 8px;
            gap: 4px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .board-center {
            grid-column: 2 / 11;
            grid-row: 2 / 11;
            background-image: url('center-image.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            border: 2px dashed #bbb;
        }

        .cell {
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }

        .cell.selected {
            border: 4px solid var(--select-yellow) !important;
            background-color: #fef08a;
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.9);
            z-index: 10;
        }

        /* Grid 定位 (1-40 格) */
        .cell:nth-child(1)  { grid-column: 1;  grid-row: 1; }
        .cell:nth-child(2)  { grid-column: 2;  grid-row: 1; }
        .cell:nth-child(3)  { grid-column: 3;  grid-row: 1; }
        .cell:nth-child(4)  { grid-column: 4;  grid-row: 1; }
        .cell:nth-child(5)  { grid-column: 5;  grid-row: 1; }
        .cell:nth-child(6)  { grid-column: 6;  grid-row: 1; }
        .cell:nth-child(7)  { grid-column: 7;  grid-row: 1; }
        .cell:nth-child(8)  { grid-column: 8;  grid-row: 1; }
        .cell:nth-child(9)  { grid-column: 9;  grid-row: 1; }
        .cell:nth-child(10) { grid-column: 10; grid-row: 1; }
        .cell:nth-child(11) { grid-column: 11; grid-row: 1; }

        .cell:nth-child(12) { grid-column: 11; grid-row: 2; }
        .cell:nth-child(13) { grid-column: 11; grid-row: 3; }
        .cell:nth-child(14) { grid-column: 11; grid-row: 4; }
        .cell:nth-child(15) { grid-column: 11; grid-row: 5; }
        .cell:nth-child(16) { grid-column: 11; grid-row: 6; }
        .cell:nth-child(17) { grid-column: 11; grid-row: 7; }
        .cell:nth-child(18) { grid-column: 11; grid-row: 8; }
        .cell:nth-child(19) { grid-column: 11; grid-row: 9; }
        .cell:nth-child(20) { grid-column: 11; grid-row: 10; }

        .cell:nth-child(21) { grid-column: 11; grid-row: 11; }
        .cell:nth-child(22) { grid-column: 10; grid-row: 11; }
        .cell:nth-child(23) { grid-column: 9;  grid-row: 11; }
        .cell:nth-child(24) { grid-column: 8;  grid-row: 11; }
        .cell:nth-child(25) { grid-column: 7;  grid-row: 11; }
        .cell:nth-child(26) { grid-column: 6;  grid-row: 11; }
        .cell:nth-child(27) { grid-column: 5;  grid-row: 11; }
        .cell:nth-child(28) { grid-column: 4;  grid-row: 11; }
        .cell:nth-child(29) { grid-column: 3;  grid-row: 11; }
        .cell:nth-child(30) { grid-column: 2;  grid-row: 11; }
        .cell:nth-child(31) { grid-column: 1;  grid-row: 11; }

        .cell:nth-child(32) { grid-column: 1;  grid-row: 10; }
        .cell:nth-child(33) { grid-column: 1;  grid-row: 9; }
        .cell:nth-child(34) { grid-column: 1;  grid-row: 8; }
        .cell:nth-child(35) { grid-column: 1;  grid-row: 7; }
        .cell:nth-child(36) { grid-column: 1;  grid-row: 6; }
        .cell:nth-child(37) { grid-column: 1;  grid-row: 5; }
        .cell:nth-child(38) { grid-column: 1;  grid-row: 4; }
        .cell:nth-child(39) { grid-column: 1;  grid-row: 3; }
        .cell:nth-child(40) { grid-column: 1;  grid-row: 2; }

        /* 右側面板 */
        .right-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-card {
            background: #fff;
            border: 3.5px solid var(--border-color);
            border-radius: 20px;
            padding: 15px 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .info-card-title {
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .item-list, .land-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-row">
        <div class="status-card">
            <div class="status-item">
                <div class="title">遊戲剩餘時間</div>
                <div class="value" id="disp-game-timer">00:00:00</div>
            </div>
        </div>
        <div class="status-card">
            <div class="status-item">
                <div class="title">現在時間</div>
                <div class="value" id="disp-current-time">00:00:00</div>
            </div>
        </div>
    </div>

    <div class="player-bar">
        <div>玩家金額 <span class="val-green" id="disp-player-money">$0</span></div>
        <div>通行證數量 <span class="val-orange" id="disp-player-pass">1</span></div>
        <div>擁有道具 <span class="val-orange" id="disp-player-items">0</span></div>
        <div>擁有土地 <span class="val-orange" id="disp-player-lands">1</span></div>
    </div>

    <div class="main-layout">
        <div class="board" id="disp-board">
            <div class="board-center"></div>
        </div>

        <div class="right-column">
            <div class="info-card">
                <div class="info-card-title">現有道具</div>
                <div class="item-list">
                    <div class="item-row">
                        <span>金骰子</span>
                        <span class="val-orange" id="disp-dice-count">0 次</span>
                    </div>
                    <div class="item-row">
                        <span>監獄解放卡</span>
                        <span class="val-orange" id="disp-jail-count">0 次</span>
                    </div>
                    <div class="item-row">
                        <span>隧道卡</span>
                        <span class="val-orange" id="disp-tunnel-count">0 次</span>
                    </div>
                </div>
            </div>

            <div class="info-card" style="flex: 1;">
                <div class="info-card-title">已購買土地</div>
                <div class="land-list">
                    <div>埃及</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gameStateRef = ref(db, 'gameState');

    // 1. 初始化棋盤格子 (40格)
    const board = document.getElementById('disp-board');
    for (let i = 0; i < 40; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = i;
        board.appendChild(cell);
    }

    // 2. 監聽 Controller 即時更新數據
    onValue(gameStateRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        // 倒計時
        if (data.gameTimerText) {
            document.getElementById('disp-game-timer').textContent = data.gameTimerText;
        }

        // 玩家基礎數據
        if (data.player) {
            document.getElementById('disp-player-money').textContent = `$${data.player.money}`;
            document.getElementById('disp-player-pass').textContent = data.player.pass;
            document.getElementById('disp-player-items').textContent = data.player.items;
            document.getElementById('disp-player-lands').textContent = data.player.lands;
        }

        // 道具可使用次數
        if (data.items) {
            document.getElementById('disp-dice-count').textContent = `${data.items.dice.usable} 次`;
            document.getElementById('disp-jail-count').textContent = `${data.items.jail.usable} 次`;
            document.getElementById('disp-tunnel-count').textContent = `${data.items.tunnel.usable} 次`;
        }

        // 棋盤高亮玩家位置
        document.querySelectorAll('.cell').forEach(cell => cell.classList.remove('selected'));
        if (data.confirmedPosition !== undefined && data.confirmedPosition >= 0) {
            const targetCell = board.querySelector(`[data-index='${data.confirmedPosition}']`);
            if (targetCell) targetCell.classList.add('selected');
        }
    });

    // 3. 現在時間時鐘
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('disp-current-time').textContent = `${hours}:${minutes}:${seconds}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
</script>

</body>
</html>
