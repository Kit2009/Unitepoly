<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲主顯示屏 (Display)</title>
    <style>
        :root {
            --primary-bg: #cdeaf7;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --border-color: #000;
            --text-dark: #1f2937;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            background-image: radial-gradient(circle, #e0f2fe 0%, #bae6fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-dark);
        }

        .display-container {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 頂部資訊列 */
        .top-info-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .info-card {
            background: var(--panel-bg);
            border: 3px solid var(--border-color);
            border-radius: 16px;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-card .label { font-size: 1.2rem; font-weight: bold; color: #4b5563; }
        .info-card .value { font-size: 2.5rem; font-weight: 800; }

        /* 中間主區域 */
        .main-display-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }

        /* 棋盤樣式 */
        .board {
            background: #fff;
            border: 4px solid var(--border-color);
            border-radius: 20px;
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(11, 1fr);
            padding: 8px;
            gap: 4px;
            width: 100%;
        }

        .board-center {
            grid-column: 2 / 11;
            grid-row: 2 / 11;
            background-image: url('center-image.jpg'); /* 棋盤中間大圖 */
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            border: 2px dashed #ccc;
        }

        .cell {
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 玩家棋子代表標記 */
        .player-token {
            width: 28px;
            height: 28px;
            background-color: #ef4444;
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: none;
            animation: bounce 0.6s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-6px); }
        }

        .cell.has-player .player-token {
            display: block;
        }

        /* 網格定位 1 - 40 */
        .cell:nth-child(1)  { grid-column: 1;  grid-row: 1; }
        .cell:nth-child(2)  { grid-column: 2;  grid-row: 1; }
        .cell:nth-child(3)  { grid-column: 3;  grid-row: 1; }
        .cell:nth-child(4)  { grid-column: 4;  grid-row: 1; }
        .cell:nth-child(5)  { grid-column: 5;  grid-row: 1; }
        .cell:nth-child(6)  { grid-column: 6;  grid-row: 1; }
        .cell:nth-child(7)  { grid-column: 7;  grid-row: 1; }
        .cell:nth-child(8)  { grid-column: 8;  grid-row: 1; }
        .cell:nth-child(9)  { grid-column: 9;  grid-row: 1; }
        .cell:nth-child(10) { grid-column: 10; grid-row: 1; }
        .cell:nth-child(11) { grid-column: 11; grid-row: 1; }

        .cell:nth-child(12) { grid-column: 11; grid-row: 2; }
        .cell:nth-child(13) { grid-column: 11; grid-row: 3; }
        .cell:nth-child(14) { grid-column: 11; grid-row: 4; }
        .cell:nth-child(15) { grid-column: 11; grid-row: 5; }
        .cell:nth-child(16) { grid-column: 11; grid-row: 6; }
        .cell:nth-child(17) { grid-column: 11; grid-row: 7; }
        .cell:nth-child(18) { grid-column: 11; grid-row: 8; }
        .cell:nth-child(19) { grid-column: 11; grid-row: 9; }
        .cell:nth-child(20) { grid-column: 11; grid-row: 10; }

        .cell:nth-child(21) { grid-column: 11; grid-row: 11; }
        .cell:nth-child(22) { grid-column: 10; grid-row: 11; }
        .cell:nth-child(23) { grid-column: 9;  grid-row: 11; }
        .cell:nth-child(24) { grid-column: 8;  grid-row: 11; }
        .cell:nth-child(25) { grid-column: 7;  grid-row: 11; }
        .cell:nth-child(26) { grid-column: 6;  grid-row: 11; }
        .cell:nth-child(27) { grid-column: 5;  grid-row: 11; }
        .cell:nth-child(28) { grid-column: 4;  grid-row: 11; }
        .cell:nth-child(29) { grid-column: 3;  grid-row: 11; }
        .cell:nth-child(30) { grid-column: 2;  grid-row: 11; }
        .cell:nth-child(31) { grid-column: 1;  grid-row: 11; }

        .cell:nth-child(32) { grid-column: 1;  grid-row: 10; }
        .cell:nth-child(33) { grid-column: 1;  grid-row: 9; }
        .cell:nth-child(34) { grid-column: 1;  grid-row: 8; }
        .cell:nth-child(35) { grid-column: 1;  grid-row: 7; }
        .cell:nth-child(36) { grid-column: 1;  grid-row: 6; }
        .cell:nth-child(37) { grid-column: 1;  grid-row: 5; }
        .cell:nth-child(38) { grid-column: 1;  grid-row: 4; }
        .cell:nth-child(39) { grid-column: 1;  grid-row: 3; }
        .cell:nth-child(40) { grid-column: 1;  grid-row: 2; }

        /* 右側資訊面板 */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .side-card {
            background: var(--panel-bg);
            border: 3.5px solid var(--border-color);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .side-card-title {
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 2px solid #ddd;
            padding-bottom: 6px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .stat-val-green { color: var(--accent-green); font-size: 1.5rem; font-weight: 800; }
        .stat-val-orange { color: var(--accent-orange); font-size: 1.4rem; font-weight: 800; }
        .stat-val-red { color: var(--accent-red); font-size: 1.4rem; font-weight: 800; }
    </style>
</head>
<body>

<div class="display-container">
    <div class="top-info-bar">
        <div class="info-card">
            <div class="label">遊戲剩餘時間</div>
            <div class="value" id="disp-game-timer">120:00:00</div>
        </div>
        <div class="info-card">
            <div class="label">還款倒計時</div>
            <div class="value" style="color: var(--accent-red);" id="disp-bank-timer">00:00:00</div>
        </div>
    </div>

    <div class="main-display-layout">
        <div class="board" id="display-board">
            <div class="board-center"></div>
        </div>

        <div class="right-panel">
            <div class="side-card">
                <div class="side-card-title">玩家狀態</div>
                <div class="stat-row">
                    <span>現有資金</span>
                    <span class="stat-val-green" id="disp-money">$0</span>
                </div>
                <div class="stat-row">
                    <span>銀行債務</span>
                    <span class="stat-val-red" id="disp-debt">$0</span>
                </div>
                <div class="stat-row">
                    <span>通行證</span>
                    <span class="stat-val-orange" id="disp-pass">1</span>
                </div>
                <div class="stat-row">
                    <span>道具數量</span>
                    <span class="stat-val-orange" id="disp-items">0</span>
                </div>
            </div>

            <div class="side-card">
                <div class="side-card-title">已申請資助</div>
                <div class="stat-row">
                    <span>綜援</span>
                    <span id="disp-cssa">0 次</span>
                </div>
                <div class="stat-row">
                    <span>全額津貼</span>
                    <span id="disp-allowance">0 次</span>
                </div>
                <div class="stat-row">
                    <span>交通補貼</span>
                    <span id="disp-transport">0 次</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAiEI_WuLV1va-mooABk6e5TmegK-45cAg",
  authDomain: "unitepoly-bb65a.firebaseapp.com",
  databaseURL: "https://unitepoly-bb65a-default-rtdb.firebaseio.com",
  projectId: "unitepoly-bb65a",
  storageBucket: "unitepoly-bb65a.firebasestorage.app",
  messagingSenderId: "1014615394934",
  appId: "1:1014615394934:web:26958994ec19e037742d57"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gameStateRef = ref(db, 'gameState');

    // 💡 40 個格子的指令圖片網址 (請保持 Controller 與 Display 一致)
    const tileImages = [
        'images/tile_0.png', 'images/tile_1.png', 'images/tile_2.png', 'images/tile_3.png',
        'images/tile_4.png', 'images/tile_5.png', 'images/tile_6.png', 'images/tile_7.png',
        'images/tile_8.png', 'images/tile_9.png', 'images/tile_10.png', 'images/tile_11.png',
        'images/tile_12.png', 'images/tile_13.png', 'images/tile_14.png', 'images/tile_15.png',
        'images/tile_16.png', 'images/tile_17.png', 'images/tile_18.png', 'images/tile_19.png',
        'images/tile_20.png', 'images/tile_21.png', 'images/tile_22.png', 'images/tile_23.png',
        'images/tile_24.png', 'images/tile_25.png', 'images/tile_26.png', 'images/tile_27.png',
        'images/tile_28.png', 'images/tile_29.png', 'images/tile_30.png', 'images/tile_31.png',
        'images/tile_32.png', 'images/tile_33.png', 'images/tile_34.png', 'images/tile_35.png',
        'images/tile_36.png', 'images/tile_37.png', 'images/tile_38.png', 'images/tile_39.png'
    ];

    // 動態建置 40 個棋盤格子
    const board = document.getElementById('display-board');
    for (let i = 0; i < 40; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = i;

        if (tileImages[i]) {
            cell.style.backgroundImage = `url('${tileImages[i]}')`;
        }

        const token = document.createElement('div');
        token.className = 'player-token';
        cell.appendChild(token);

        board.appendChild(cell);
    }

    // 即時同步來自 Firebase 的資料
    onValue(gameStateRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        if (data.gameTimerText) {
            document.getElementById('disp-game-timer').textContent = data.gameTimerText;
        }

        if (data.player) {
            document.getElementById('disp-money').textContent = `$${data.player.money || 0}`;
            document.getElementById('disp-pass').textContent = data.player.pass || 0;
            document.getElementById('disp-items').textContent = data.player.items || 0;
        }

        if (data.bank) {
            document.getElementById('disp-debt').textContent = `$${data.bank.totalDebt || 0}`;
            document.getElementById('disp-bank-timer').textContent = data.bank.debtTimerText || "00:00:00";
        }

        if (data.subsidies) {
            document.getElementById('disp-cssa').textContent = `${data.subsidies.cssa || 0} 次`;
            document.getElementById('disp-allowance').textContent = `${data.subsidies.allowance || 0} 次`;
            document.getElementById('disp-transport').textContent = `${data.subsidies.transport || 0} 次`;
        }

        // 更新玩家在棋盤上的指示位置
        document.querySelectorAll('.cell').forEach(cell => cell.classList.remove('has-player'));
        if (data.confirmedPosition !== undefined && data.confirmedPosition >= 0) {
            const targetCell = board.querySelector(`[data-index='${data.confirmedPosition}']`);
            if (targetCell) {
                targetCell.classList.add('has-player');
            }
        }
    });
</script>

</body>
</html>
