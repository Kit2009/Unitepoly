<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲主顯示屏 (Display)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; }

        body {
            background: #c2e8f8 url('https://img.freepik.com/free-vector/blue-cloudy-sky-background_52683-27421.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 15px 25px;
            color: #1f2937;
            overflow: hidden;
            position: relative;
        }

        /* 頂部時間欄 (第 1 列) */
        .top-timer-bar {
            background: rgba(224, 242, 254, 0.9);
            border: 2px solid #ffffff;
            border-radius: 20px;
            padding: 6px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .timer-box { text-align: center; }
        .timer-box .label { font-size: 0.85rem; font-weight: bold; color: #374151; margin-bottom: 2px; }
        .timer-box .val { font-size: 2rem; font-weight: 800; color: #1e3a8a; letter-spacing: 1px; }

        /* 頂部數據欄 (第 2 列) */
        .top-stats-bar {
            background: rgba(224, 242, 254, 0.9);
            border: 2px solid #ffffff;
            border-radius: 20px;
            padding: 8px 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            font-size: 1.1rem;
            font-weight: bold;
        }

        .stat-item { display: flex; align-items: center; gap: 8px; }
        .val-money { color: #10b981; font-size: 1.6rem; font-weight: 800; }
        .val-orange { color: #f59e0b; font-size: 1.4rem; font-weight: 800; }

        /* 主內容容器 */
        .main-container {
            position: relative;
            height: calc(100vh - 150px);
        }

        /* 原本三欄區域 */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 280px 240px;
            gap: 12px;
            height: 100%;
        }

        /* 1. 大富翁棋盤 (左欄) */
        .board-card {
            background: #ffffff;
            border: 3.5px solid #000000;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 10px;
        }

        /* 2. 現有房產 (中欄) */
        .land-card {
            background: #ffffff;
            border: 3.5px solid #000000;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 2px solid #000000;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .land-table { width: 100%; border-collapse: collapse; text-align: center; }
        .land-table th { font-size: 0.8rem; color: #6b7280; padding-bottom: 8px; }
        .land-table td { font-size: 1rem; font-weight: bold; padding: 6px 0; }
        .land-name { text-align: left; font-size: 1.2rem; font-weight: 800; }
        .land-income { color: #10b981; }

        /* 3. 右側欄 */
        .right-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-box {
            background: #ffffff;
            border: 3.5px solid #000000;
            border-radius: 18px;
            padding: 12px 15px;
        }

        .item-list { display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .item-name-price { font-size: 0.95rem; }
        .item-price-sub { font-size: 0.75rem; color: #6b7280; margin-left: 4px; }

        .subsidy-list { display: flex; flex-direction: column; gap: 6px; }
        .subsidy-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: bold; color: #374151; }

        .weather-notice-box {
            background: #ffffff;
            border: 3.5px solid #000000;
            border-radius: 18px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        /* 🎬 原本隱藏的黑色播放器覆蓋層 (完全貼合你的截圖設計) */
        .video-hidden-player {
            display: none; /* 平時隱藏 */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            border-radius: 20px;
            z-index: 100;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .video-hidden-player.active {
            display: flex; /* 按下播放器/選擇影片時開啟 */
        }

        .video-hidden-player video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="top-timer-bar">
        <div class="timer-box">
            <div class="label">遊戲剩餘時間</div>
            <div class="val" id="disp-game-timer">00:00:00</div>
        </div>
        <div class="timer-box">
            <div class="label">現在時間</div>
            <div class="val" id="disp-current-time">00:00:00</div>
        </div>
    </div>

    <div class="top-stats-bar">
        <div class="stat-item">玩家金額 <span class="val-money" id="disp-player-money">$00000</span></div>
        <div class="stat-item">通行證數量 <span class="val-orange" id="disp-player-pass">1</span></div>
        <div class="stat-item">擁有道具 <span class="val-orange" id="disp-player-items">1</span></div>
        <div class="stat-item">擁有土地 <span class="val-orange" id="disp-player-lands">1</span></div>
    </div>

    <div class="main-container">

        <div class="video-hidden-player" id="video-overlay">
            <video id="event-video" playsinline>
                <source src="" type="video/mp4">
            </video>
        </div>

        <div class="main-content">
            <div class="board-card">
                </div>

            <div class="land-card">
                <div class="card-header">
                    <span>現有房產</span>
                    <span class="val-orange">1</span>
                </div>
                <table class="land-table">
                    <thead>
                        <tr>
                            <th style="text-align: left;">地方</th>
                            <th>收入</th>
                            <th>倒計時</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="land-name">埃及</td>
                            <td class="land-income">+1200</td>
                            <td>20:00</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="right-col">
                <div class="info-box">
                    <div class="card-header" style="border:none; padding:0; margin-bottom:5px;">
                        <span>現有道具</span>
                    </div>
                    <div style="text-align: right; font-size: 0.75rem; color: #6b7280; font-weight: bold; margin-bottom: 4px;">使用次數</div>
                    <div class="item-list">
                        <div class="item-row">
                            <div class="item-name-price">金骰子 <span class="item-price-sub">$2000</span></div>
                            <div class="val-orange">3</div>
                        </div>
                        <div class="item-row">
                            <div class="item-name-price">監獄解放卡 <span class="item-price-sub">$1000</span></div>
                            <div class="val-orange">2</div>
                        </div>
                        <div class="item-row">
                            <div class="item-name-price">隧道卡 <span class="item-price-sub">$2000</span></div>
                            <div class="val-orange">2</div>
                        </div>
                    </div>
                </div>

                <div class="info-box">
                    <div class="subsidy-list">
                        <div class="subsidy-row"><span>申請綜援次數</span><span class="val-orange">0</span></div>
                        <div class="subsidy-row"><span>申請全津次數</span><span class="val-orange">0</span></div>
                        <div class="subsidy-row"><span>申請交補次數</span><span class="val-orange">0</span></div>
                    </div>
                </div>

                <div class="weather-notice-box">
                    <div style="font-size: 1.2rem; font-weight: bold; color: #6b7280; margin-bottom: 2px;">?</div>
                    <div style="font-size: 1rem; font-weight: bold;">天文台通知</div>
                    <div style="font-size: 1.8rem; font-weight: 800; margin-top: 4px;" id="weather-timer-disp">15:00</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAiEI_WuLV1va-mooABk6e5TmegK-45cAg",
  authDomain: "unitepoly-bb65a.firebaseapp.com",
  databaseURL: "https://unitepoly-bb65a-default-rtdb.firebaseio.com",
  projectId: "unitepoly-bb65a",
  storageBucket: "unitepoly-bb65a.firebasestorage.app",
  messagingSenderId: "1014615394934",
  appId: "1:1014615394934:web:26958994ec19e037742d57"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const gameStateRef = ref(db, 'gameState');

        const videoOverlay = document.getElementById('video-overlay');
        const videoPlayer = document.getElementById('event-video');

        // 時間自動運轉
        setInterval(() => {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('disp-current-time').textContent = `${h}:${m}:${s}`;
        }, 1000);

        // 控制黑色播放器開關與影片播放
        onValue(gameStateRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            if (data.eventVideo) {
                const v = data.eventVideo;
                
                // 開放/隱藏黑色覆蓋層
                if (v.visible) {
                    videoOverlay.classList.add('active');
                } else {
                    videoOverlay.classList.remove('active');
                    videoPlayer.pause();
                }

                // 切換影片來源
                if (v.src && videoPlayer.getAttribute('src') !== v.src) {
                    videoPlayer.src = v.src;
                }

                // 播放控制
                if (v.action === 'play') {
                    videoPlayer.play();
                } else if (v.action === 'pause') {
                    videoPlayer.pause();
                } else if (v.action === 'reset') {
                    videoPlayer.currentTime = 0;
                    videoPlayer.pause();
                }
            }
        });
    </script>
</body>
</html>
