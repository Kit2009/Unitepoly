<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模擬遊戲主顯示介面 (Display)</title>
    <style>
        :root {
            --primary-bg: #cdeaf7;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --border-color: #000;
            --text-dark: #1f2937;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --select-yellow: #facc15;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            background-image: radial-gradient(circle, #e0f2fe 0%, #bae6fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(10px, 2vw, 20px);
            color: var(--text-dark);
            overflow: hidden; /* 防止縮放時出現滾動條 */
        }

        .container {
            width: 100%;
            max-width: 1600px;
            aspect-ratio: 16 / 9;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border: 3px solid var(--border-color);
            border-radius: 16px;
            padding: clamp(10px, 1.5vw, 20px);
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: clamp(10px, 1.5vw, 20px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            position: relative;
            overflow: hidden;
            transform-origin: center center; /* 用於自動調節大小 */
            transition: transform 0.1s ease-out;
        }

        .panel {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: clamp(10px, 1.2vw, 15px);
            display: flex;
            flex-direction: column;
        }

        /* 棋盤面板 (左側佔滿兩列) */
        .board-panel {
            grid-row: 1 / 3;
            grid-column: 1 / 2;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .board-grid {
            width: 100%;
            height: 100%;
            max-height: 80vh;
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(11, 1fr);
            gap: 2px;
            background-color: var(--border-color);
            border: 2px solid var(--border-color);
            position: relative;
        }

        .cell {
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(10px, 1vw, 14px);
            font-weight: bold;
            position: relative;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .cell.selected {
            outline: 4px solid var(--select-yellow) !important;
            outline-offset: -4px;
            z-index: 2;
        }

        /* 已購買土地：靜態綠色外框 */
        .cell.owned-land {
            outline: 4px solid #10b981 !important;
            outline-offset: -4px;
            z-index: 5;
        }

        /* 玩家停留於已購買土地：動態綠黃閃爍邊框 */
        .cell.owned-land.player-here {
            animation: pulse-green-yellow 1s infinite alternate !important;
            z-index: 10;
        }

        @keyframes pulse-green-yellow {
            0% {
                outline: 5px solid #10b981;
                box-shadow: inset 0 0 10px #10b981;
            }
            100% {
                outline: 5px solid #facc15;
                box-shadow: inset 0 0 10px #facc15;
            }
        }

        .board-center {
            grid-column: 2 / 11;
            grid-row: 2 / 11;
            background-color: #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .board-center h1 {
            font-size: clamp(24px, 3vw, 42px);
            margin-bottom: 15px;
            color: #1e3a8a;
            letter-spacing: 2px;
        }

        .timer-display {
            font-size: clamp(32px, 4vw, 64px);
            font-family: monospace;
            font-weight: bold;
            color: #b91c1c;
            background: #fee2e2;
            padding: 10px 25px;
            border-radius: 8px;
            border: 2px solid #ef4444;
        }

        /* 右上面板：玩家狀態 */
        .info-panel {
            grid-row: 1 / 2;
            grid-column: 2 / 3;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }

        .info-header {
            font-size: clamp(18px, 1.8vw, 24px);
            font-weight: bold;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: clamp(12px, 1vw, 14px);
            color: #4b5563;
        }

        .stat-value {
            font-size: clamp(20px, 2.2vw, 32px);
            font-weight: bold;
            color: #111827;
        }

        /* 右下面板：樓房清單與收益 */
        .houses-panel {
            grid-row: 2 / 3;
            grid-column: 2 / 3;
            display: flex;
            flex-direction: column;
        }

        .house-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 5px;
        }

        .house-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: clamp(12px, 1.1vw, 16px);
            font-weight: 500;
        }

        /* 修改：全屏多媒體覆蓋區 (改成固定佔據整個螢幕 fixed) */
        .media-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }

        .media-overlay.hidden {
            display: none;
        }

        .media-overlay img, .media-overlay video {
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* 保持圖片/影片比例滿屏展示，不拉伸變形 */
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div class="panel board-panel">
        <div class="board-grid" id="game-board">
            <div class="board-center">
                <h1>模擬遊戲</h1>
                <div class="timer-display" id="disp-game-timer">02:00:00</div>
            </div>
        </div>
    </div>

    <div class="panel info-panel">
        <div class="info-header">玩家概況</div>
        <div class="stat-grid">
            <div class="stat-card">
                <span class="stat-label">金錢</span>
                <span class="stat-value" id="disp-player-money" style="color: var(--accent-green);">$0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">通行證</span>
                <span class="stat-value" id="disp-score-pass">01</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">持有土地</span>
                <span class="stat-value" id="disp-player-lands">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">持有道具</span>
                <span class="stat-value" id="disp-player-items">0</span>
            </div>
        </div>
    </div>

    <div class="panel houses-panel">
        <div class="info-header">已建樓房與收益</div>
        <div class="house-list" id="disp-house-container">
            </div>
    </div>
</div>

<div class="media-overlay hidden" id="media-box"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAiEI_WuLV1va-mooABk6e5TmegK-45cAg",
        authDomain: "unitepoly-bb65a.firebaseapp.com",
        databaseURL: "https://unitepoly-bb65a-default-rtdb.firebaseio.com",
        projectId: "unitepoly-bb65a",
        storageBucket: "unitepoly-bb65a.firebasestorage.app",
        messagingSenderId: "1014615394934",
        appId: "1:1014615394934:web:26958994ec19e037742d57"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gameStateRef = ref(db, 'gameState');

    // 新增：自動調節畫面大小 (依據視窗高寬比縮放 container)
    function autoScale() {
        const container = document.getElementById('main-container');
        if (!container) return;
        
        const windowWidth = window.innerWidth - 30; // 扣除 body padding
        const windowHeight = window.innerHeight - 30;
        
        // 算出 container 預設寬高與視窗的比例
        const rect = container.getBoundingClientRect();
        const baseWidth = container.offsetWidth;
        const baseHeight = container.offsetHeight;
        
        const scaleX = windowWidth / baseWidth;
        const scaleY = windowHeight / baseHeight;
        const scale = Math.min(scaleX, scaleY, 1); // 最高為 1 倍原圖，不破壞排版
        
        container.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', autoScale);
    setTimeout(autoScale, 100);

    const tileImages = [
        'images/tile_0.png', 'images/tile_1.png', 'images/tile_2.png', 'images/tile_3.png',
        'images/tile_4.png', 'images/tile_5.png', 'images/tile_6.png', 'images/tile_7.png',
        'images/tile_8.png', 'images/tile_9.png', 'images/tile_10.png', 'images/tile_11.png',
        'images/tile_12.png', 'images/tile_13.png', 'images/tile_14.png', 'images/tile_15.png',
        'images/tile_16.png', 'images/tile_17.png', 'images/tile_18.png', 'images/tile_19.png',
        'images/tile_20.png', 'images/tile_21.png', 'images/tile_22.png', 'images/tile_23.png',
        'images/tile_24.png', 'images/tile_25.png', 'images/tile_26.png', 'images/tile_27.png',
        'images/tile_28.png', 'images/tile_29.png', 'images/tile_30.png', 'images/tile_31.png',
        'images/tile_32.png', 'images/tile_33.png', 'images/tile_34.png', 'images/tile_35.png',
        'images/tile_36.png', 'images/tile_37.png', 'images/tile_38.png', 'images/tile_39.png'
    ];

    // 初始化 11x11 棋盤外圈格子
    function renderBoard() {
        const board = document.getElementById('game-board');
        const matrix = Array(11).fill(null).map(() => Array(11).fill(null));

        let index = 0;
        for (let c = 0; c < 11; c++) matrix[10][c] = index++;
        for (let r = 9; r >= 0; r--) matrix[r][10] = index++;
        for (let c = 9; c >= 0; c--) matrix[0][c] = index++;
        for (let r = 1; r < 10; r++) matrix[r][0] = index++;

        for (let r = 0; r < 11; r++) {
            for (let c = 0; c < 11; c++) {
                const cellIdx = matrix[r][c];
                if (cellIdx !== null) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.index = cellIdx;
                    cell.style.gridRow = r + 1;
                    cell.style.gridColumn = c + 1;
                    if (tileImages[cellIdx]) {
                        cell.style.backgroundImage = `url('${tileImages[cellIdx]}')`;
                    }
                    board.appendChild(cell);
                }
            }
        }
    }

    // 動態更新 Display 棋盤格子的外框狀態
    function updateBoardLandStyles(landsData, confirmedPosition) {
        if (!landsData) return;

        const landMap = {};
        Object.values(landsData).forEach(land => {
            if (land.id !== undefined) {
                landMap[land.id] = land;
            }
        });

        const board = document.getElementById('game-board');
        if (!board) return;

        for (let i = 0; i < 40; i++) {
            const cell = board.querySelector(`[data-index='${i}']`);
            if (!cell) continue;

            const land = landMap[i];
            const isOwned = land && land.owned;
            const isPlayerHere = (confirmedPosition === i);

            // 1. 綠色外框 (已買地)
            if (isOwned) {
                cell.classList.add('owned-land');
            } else {
                cell.classList.remove('owned-land');
            }

            // 2. 綠黃閃爍 (已買地且玩家位置在此)
            if (isOwned && isPlayerHere) {
                cell.classList.add('player-here');
            } else {
                cell.classList.remove('player-here');
            }
        }
    }

    renderBoard();

    // 監聽 Firebase 數據同步
    onValue(gameStateRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        // 1. 玩家資訊更新
        if (data.player) {
            document.getElementById('disp-player-money').textContent = `$${data.player.money}`;
            document.getElementById('disp-score-pass').textContent = String(data.player.pass).padStart(2, '0');
            document.getElementById('disp-player-lands').textContent = data.player.lands || 0;
            document.getElementById('disp-player-items').textContent = data.player.items || 0;
        }

        // 2. 倒數計時器更新
        if (data.gameTimerText) {
            document.getElementById('disp-game-timer').textContent = data.gameTimerText;
        }

        // 3. 棋盤玩家位置更新
        const board = document.getElementById('game-board');
        if (data.confirmedPosition !== undefined && data.confirmedPosition !== null) {
            board.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
            if (data.confirmedPosition >= 0) {
                const currentCell = board.querySelector(`[data-index='${data.confirmedPosition}']`);
                if (currentCell) currentCell.classList.add('selected');
            }
        }

        // 4. 更新土地外框狀態（買地綠框 / 玩家停留綠黃閃爍）
        updateBoardLandStyles(data.landsData, data.confirmedPosition);

        // 5. 樓房與收益清單更新
        const houseContainer = document.getElementById('disp-house-container');
        houseContainer.innerHTML = '';
        if (data.landsData) {
            Object.entries(data.landsData).forEach(([name, land]) => {
                if (land.built) {
                    const row = document.createElement('div');
                    row.className = 'house-item-row';
                    const timerSec = land.timer || 1200;
                    const mins = String(Math.floor(timerSec / 60)).padStart(2, '0');
                    const secs = String(timerSec % 60).padStart(2, '0');
                    row.innerHTML = `
                        <span>${name}</span>
                        <span style="color: var(--accent-green);">+$${land.income}</span>
                        <span>${mins}:${secs}</span>
                    `;
                    houseContainer.appendChild(row);
                }
            });
        }

        // 6. 全屏媒體播放器狀態同步
        const mediaBox = document.getElementById('media-box');
        if (data.mediaState && data.mediaState.visible) {
            mediaBox.classList.remove('hidden');
            mediaBox.innerHTML = data.mediaState.type === 'video'
                ? `<video src="${data.mediaState.src}" autoplay ${data.mediaState.playing ? 'controls' : ''}></video>`
                : `<img src="${data.mediaState.src}" alt="media">`;
        } else {
            mediaBox.classList.add('hidden');
            mediaBox.innerHTML = '';
        }
    });
</script>

</body>
</html>
