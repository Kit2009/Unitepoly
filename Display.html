<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模擬遊戲主顯示介面 (Display)</title>
    <style>
        :root {
            --primary-bg: #cdeaf7;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --border-color: #000;
            --text-dark: #1f2937;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --select-yellow: #facc15;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            background-image: radial-gradient(circle, #e0f2fe 0%, #bae6fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(10px, 2vw, 20px);
            color: var(--text-dark);
        }

        /* 滿版響應式容器 (16:9 比例) */
        .app-container {
            width: 100%;
            max-width: 1600px;
            aspect-ratio: 16 / 9;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border: 3px solid var(--border-color);
            border-radius: 20px;
            padding: clamp(10px, 1.5vw, 20px);
            display: flex;
            flex-direction: column;
            gap: clamp(10px, 1.2vw, 20px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        /* 頂部玩家資訊列 */
        .top-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: clamp(10px, 1.5vw, 20px);
            height: 12%;
        }

        .info-card {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 2px 2px 0px var(--border-color);
        }

        .info-card .label {
            font-size: clamp(0.75rem, 1vw, 1rem);
            font-weight: 700;
            color: #4b5563;
            margin-bottom: 2px;
        }

        .info-card .value {
            font-size: clamp(1.1rem, 1.8vw, 2rem);
            font-weight: 900;
            color: var(--text-dark);
        }

        .value.money { color: #047857; }

        /* 主內容分欄 (左 7 : 右 3) */
        .main-content {
            display: flex;
            gap: clamp(10px, 1.5vw, 20px);
            height: 86%;
        }

        /* 左側：棋盤區 (佔 70%) */
        .board-section {
            flex: 7;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 3px 3px 0px var(--border-color);
            position: relative;
        }

        .section-title {
            font-size: clamp(0.9rem, 1.2vw, 1.2rem);
            font-weight: 800;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 棋盤 Grid 格子佈局 */
        .board-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(11, 1fr);
            gap: 2px;
            background-color: var(--border-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 2px;
        }

        /* 棋盤單一格子外觀 */
        .board-cell {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: clamp(0.5rem, 0.65vw, 0.8rem);
            font-weight: 700;
            text-align: center;
            padding: 2px;
            position: relative;
            user-select: none;
            line-height: 1.1;
            word-break: break-all;
        }

        /* 外圍圈格子 (1~40格) */
        .board-cell.outer-cell {
            background-color: #f8fafc;
        }

        /* 中央空心區域 */
        .board-center {
            grid-column: 2 / 11;
            grid-row: 2 / 11;
            background-color: rgba(224, 242, 254, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(1.2rem, 2.5vw, 3rem);
            font-weight: 900;
            color: rgba(30, 58, 138, 0.2);
            letter-spacing: 4px;
            position: relative;
        }

        /* 玩家棋子高亮樣式 */
        .board-cell.active-player {
            background-color: var(--select-yellow) !important;
            border: 2px solid var(--border-color);
            z-index: 10;
            box-shadow: inset 0 0 0 2px #d97706;
            animation: pulse 1.5s infinite;
        }

        /* 土地被購買高亮樣式 */
        .board-cell.owned-land {
            box-shadow: inset 0 0 0 2px var(--accent-green);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        /* 右側：狀態與清單區 (佔 30%) */
        .status-section {
            flex: 3;
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 1vw, 12px);
        }

        .status-card {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: clamp(8px, 1vw, 12px);
            box-shadow: 2px 2px 0px var(--border-color);
            display: flex;
            flex-direction: column;
        }

        /* 1. 天文台警告 */
        .card-observatory {
            flex: 1.2;
            background: #fff7ed;
            border-color: #ea580c;
        }

        /* 2. 樓房/土地監測 */
        .card-houses {
            flex: 2.5;
            overflow: hidden;
        }

        .house-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
            margin-top: 6px;
        }

        .house-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: clamp(0.7rem, 0.85vw, 0.9rem);
            font-weight: 700;
        }

        /* 3. 破產銀行債務 */
        .card-bank {
            flex: 1.2;
            background: #fef2f2;
            border-color: #dc2626;
        }

        /* 媒體播放視訊框 Overlay */
        .media-overlay {
            position: absolute;
            inset: 10px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 12px;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }

        .media-overlay.hidden {
            display: none;
        }

        .media-overlay img, .media-overlay video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="top-bar">
        <div class="info-card">
            <span class="label">玩家金額</span>
            <span class="value money" id="disp-player-money">$10,000</span>
        </div>
        <div class="info-card">
            <span class="label">通行證數量</span>
            <span class="value" id="disp-player-passes">0</span>
        </div>
        <div class="info-card">
            <span class="label">擁有道具</span>
            <span class="value" id="disp-player-items">0</span>
        </div>
        <div class="info-card">
            <span class="label">擁有土地</span>
            <span class="value" id="disp-player-lands">0</span>
        </div>
    </header>

    <main class="main-content">
        <section class="board-section">
            <div class="section-title">
                <span>🎲 實時地圖棋盤</span>
            </div>
            
            <div class="board-grid" id="board-container">
                </div>

            <div id="media-box" class="media-overlay hidden">
                </div>
        </section>

        <aside class="status-section">
            <div class="status-card card-observatory">
                <div class="section-title" style="color: #c2410c;">
                    <span>🌀 天文台警告標誌</span>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;">
                    <span id="disp-obs-signal" style="font-size: clamp(1rem, 1.4vw, 1.5rem); font-weight: 900; color: #ea580c;">無信號</span>
                    <span id="disp-obs-timer" style="font-size: clamp(0.9rem, 1.1vw, 1.2rem); font-weight: 800; background: #fff; padding: 2px 8px; border-radius: 6px; border: 1px solid #ea580c;">00:00</span>
                </div>
            </div>

            <div class="status-card card-houses">
                <div class="section-title">
                    <span>🏠 已建樓房收益監測</span>
                </div>
                <div class="house-list" id="disp-house-container">
                    <div style="text-align: center; color: #6b7280; font-size: 0.85rem; margin-top: 10px;">尚無興建樓房</div>
                </div>
            </div>

            <div class="status-card card-bank">
                <div class="section-title" style="color: #b91c1c;">
                    <span>🏦 破產銀行債務狀況</span>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;">
                    <div>
                        <div style="font-size: 0.75rem; color: #7f1d1d; font-weight: 700;">總債務累計</div>
                        <div id="disp-bank-debt" style="font-size: clamp(1.1rem, 1.5vw, 1.6rem); font-weight: 900; color: #dc2626;">$0</div>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size: 0.75rem; color: #7f1d1d; font-weight: 700;">清繳剩餘時間</div>
                        <div id="disp-bank-timer" style="font-size: clamp(0.9rem, 1.1vw, 1.2rem); font-weight: 800; background: #fff; padding: 2px 6px; border-radius: 6px; border: 1px solid #dc2626;">00:00:00</div>
                    </div>
                </div>
            </div>
        </aside>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://hong-kong-monopoly-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const gameRef = ref(database, 'gameState');

    // 地塊名稱地圖 (0 - 39)
    const boardCellNames = [
        "起點", "灣仔", "社區中心", "銅鑼灣", "繳稅", "中環碼頭", "尖沙咀", "機會", "旺角", "深水埗",
        "監獄", "九龍塘", "電力公司", "沙田", "大埔", "火車站", "屯門", "命運", "元朗", "荃灣",
        "免費停車", "西貢", "機會", "赤柱", "石澳", "機場", "數碼港", "科學園", "自來水廠", "中環",
        "探監", "長洲", "南丫島", "命運", "大嶼山", "港口", "昂坪", "機會", "淺水灣", "太平山"
    ];

    // 初始化 11x11 棋盤渲染
    function renderBoard(playerPos = null, landsData = null) {
        const boardContainer = document.getElementById('board-container');
        boardContainer.innerHTML = '';

        // 生成 11x11 Grid 地圖索引映射
        const gridMap = {};
        for (let i = 0; i < 11; i++) gridMap[`0,${i}`] = i;              // 上邊 (0 ~ 10)
        for (let i = 1; i < 11; i++) gridMap[`${i},10`] = 10 + i;        // 右邊 (11 ~ 20)
        for (let i = 9; i >= 0; i--) gridMap[`10,${i}`] = 30 - i;        // 下邊 (21 ~ 30)
        for (let i = 9; i >= 1; i--) gridMap[`${i},0`] = 40 - i;         // 左邊 (31 ~ 39)

        for (let r = 0; r < 11; r++) {
            for (let c = 0; c < 11; c++) {
                // 中央區域 (非外圍圈)
                if (r > 0 && r < 10 && c > 0 && c < 10) {
                    if (r === 1 && c === 1) {
                        const center = document.createElement('div');
                        center.className = 'board-center';
                        center.textContent = 'HONG KONG';
                        boardContainer.appendChild(center);
                    }
                    continue;
                }

                const cellIndex = gridMap[`${r},${c}`];
                const cell = document.createElement('div');
                cell.className = 'board-cell outer-cell';
                
                const landName = boardCellNames[cellIndex] || `格子 ${cellIndex + 1}`;
                
                let cellHtml = `<span>${landName}</span>`;

                // 檢查土地擁有狀態與興建狀況
                if (landsData && landsData[landName]) {
                    const landInfo = landsData[landName];
                    if (landInfo.owned) {
                        cell.classList.add('owned-land');
                    }
                    if (landInfo.built) {
                        cellHtml += `<span style="color: var(--accent-green); font-size: 0.65rem;">🏠</span>`;
                    }
                }

                cell.innerHTML = cellHtml;

                // 高亮玩家當前位置
                if (playerPos === cellIndex) {
                    cell.classList.add('active-player');
                }

                boardContainer.appendChild(cell);
            }
        }
    }

    // 初次初始化空棋盤
    renderBoard();

    // 實時監聽 Firebase 數據同步
    onValue(gameRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        // 1. 同步玩家基本資訊 (金額, 通行證, 道具, 土地)
        if (data.player) {
            document.getElementById('disp-player-money').textContent = `$${(data.player.money ?? 0).toLocaleString()}`;
            document.getElementById('disp-player-passes').textContent = data.player.passes ?? data.player.pass ?? 0;
            document.getElementById('disp-player-items').textContent = data.player.items ?? 0;
            document.getElementById('disp-player-lands').textContent = data.player.lands ?? 0;
        }

        // 2. 重新渲染棋盤 (更新玩家位置與土地狀態)
        const currentPos = (data.playerPos !== undefined && data.playerPos !== null) ? Number(data.playerPos) : null;
        renderBoard(currentPos, data.landsData);

        // 3. 天文台狀態同步
        if (data.observatoryState) {
            document.getElementById('disp-obs-signal').textContent = data.observatoryState.signal || "無信號";
            const sec = data.observatoryState.timerSeconds || 0;
            const m = String(Math.floor(sec / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            document.getElementById('disp-obs-timer').textContent = `${m}:${s}`;
        }

        // 4. 樓房/土地監測清單同步
        const houseContainer = document.getElementById('disp-house-container');
        houseContainer.innerHTML = '';
        let hasBuilding = false;

        if (data.landsData) {
            Object.entries(data.landsData).forEach(([name, land]) => {
                if (land.built) {
                    hasBuilding = true;
                    const row = document.createElement('div');
                    row.className = 'house-item-row';
                    const timerSec = land.timer || 1200;
                    const mins = String(Math.floor(timerSec / 60)).padStart(2, '0');
                    const secs = String(timerSec % 60).padStart(2, '0');
                    row.innerHTML = `
                        <span>${name}</span>
                        <span style="color: var(--accent-green);">$${land.income || 1000}</span>
                        <span>${mins}:${secs}</span>
                    `;
                    houseContainer.appendChild(row);
                }
            });
        }

        if (!hasBuilding) {
            houseContainer.innerHTML = `<div style="text-align: center; color: #6b7280; font-size: 0.85rem; margin-top: 10px;">尚無興建樓房</div>`;
        }

        // 5. 破產銀行數據同步
        if (data.bank) {
            document.getElementById('disp-bank-debt').textContent = `$${(data.bank.totalDebt || 0).toLocaleString()}`;
            document.getElementById('disp-bank-timer').textContent = data.bank.debtTimerText || "00:00:00";
        }

        // 6. 媒體播放狀態同步
        const mediaBox = document.getElementById('media-box');
        if (data.mediaState && data.mediaState.visible) {
            mediaBox.classList.remove('hidden');
            mediaBox.innerHTML = data.mediaState.type === 'video'
                ? `<video src="${data.mediaState.src}" autoplay ${data.mediaState.playing ? 'controls' : ''}></video>`
                : `<img src="${data.mediaState.src}" alt="media">`;
        } else {
            mediaBox.classList.add('hidden');
            mediaBox.innerHTML = '';
        }
    });
</script>

</body>
</html>
