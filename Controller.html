<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲控制器 (Controller)</title>
    <style>
        :root {
            --primary-bg: #cdeaf7;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --border-color: #000;
            --text-dark: #1f2937;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --select-yellow: #facc15;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            background-image: radial-gradient(circle, #e0f2fe 0%, #bae6fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: var(--text-dark);
        }

        .container {
            width: 100%;
            max-width: 1250px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .top-row {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 15px;
            height: 70px;
        }

        .status-card {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 8px 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            border: 2px solid var(--border-color);
        }

        .status-item .title { font-size: 0.85rem; color: #4b5563; }
        .status-item .value { font-size: 1.8rem; font-weight: bold; }

        .timer-control-card {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border: 2px solid var(--border-color);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-group label { font-size: 0.75rem; font-weight: bold; }
        .input-group input {
            width: 70px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border: 2px solid #9ca3af;
            border-radius: 8px;
            padding: 2px;
        }

        .btn-group { display: flex; gap: 6px; }
        .btn {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-green { background-color: var(--accent-green); }
        .btn-orange { background-color: var(--accent-orange); }
        .btn-red { background-color: var(--accent-red); }
        .btn-darkblue { background-color: #1e3a8a; }

        .player-bar {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid var(--border-color);
            height: 50px;
        }

        .val-green { color: var(--accent-green); font-size: 1.3em; font-weight: 800; }
        .val-orange { color: var(--accent-orange); font-size: 1.2em; font-weight: 800; }

        .main-layout {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 15px;
            min-height: 550px;
        }

        .menu-panel {
            background: #fff;
            border: 3px solid var(--border-color);
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: fit-content;
        }

        .menu-btn {
            background: #e0f2fe;
            border: 2px solid #38bdf8;
            color: #0369a1;
            font-size: 1.05rem;
            font-weight: bold;
            padding: 10px 0;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
        }

        .menu-btn.active {
            background: var(--accent-green);
            color: white;
            border-color: var(--border-color);
        }

        .content-view {
            width: 100%;
            display: none;
        }

        .content-view.active {
            display: block;
        }

        /* 棋盤排版 */
        .board-layout {
            display: grid;
            grid-template-columns: minmax(350px, 1.4fr) 280px;
            gap: 15px;
        }

        .board {
            background: #fff;
            border: 3.5px solid var(--border-color);
            border-radius: 18px;
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(11, 1fr);
            padding: 5px;
            gap: 3px;
            width: 100%;
        }

        .board-center {
            grid-column: 2 / 11;
            grid-row: 2 / 11;
            background-image: url('bg_poly.png'); /* 棋盤中間大圖 */
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            border: 1px dashed #ccc;
        }

        .cell {
            border: 2px solid var(--border-color);
            border-radius: 5px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .cell.selected {
            border: 4px solid var(--select-yellow) !important;
            box-shadow: 0 0 10px rgba(250, 204, 21, 1);
            z-index: 10;
        }

        /* 40 個格子的網格定位 */
        .cell:nth-child(1)  { grid-column: 1;  grid-row: 1; }
        .cell:nth-child(2)  { grid-column: 2;  grid-row: 1; }
        .cell:nth-child(3)  { grid-column: 3;  grid-row: 1; }
        .cell:nth-child(4)  { grid-column: 4;  grid-row: 1; }
        .cell:nth-child(5)  { grid-column: 5;  grid-row: 1; }
        .cell:nth-child(6)  { grid-column: 6;  grid-row: 1; }
        .cell:nth-child(7)  { grid-column: 7;  grid-row: 1; }
        .cell:nth-child(8)  { grid-column: 8;  grid-row: 1; }
        .cell:nth-child(9)  { grid-column: 9;  grid-row: 1; }
        .cell:nth-child(10) { grid-column: 10; grid-row: 1; }
        .cell:nth-child(11) { grid-column: 11; grid-row: 1; }

        .cell:nth-child(12) { grid-column: 11; grid-row: 2; }
        .cell:nth-child(13) { grid-column: 11; grid-row: 3; }
        .cell:nth-child(14) { grid-column: 11; grid-row: 4; }
        .cell:nth-child(15) { grid-column: 11; grid-row: 5; }
        .cell:nth-child(16) { grid-column: 11; grid-row: 6; }
        .cell:nth-child(17) { grid-column: 11; grid-row: 7; }
        .cell:nth-child(18) { grid-column: 11; grid-row: 8; }
        .cell:nth-child(19) { grid-column: 11; grid-row: 9; }
        .cell:nth-child(20) { grid-column: 11; grid-row: 10; }

        .cell:nth-child(21) { grid-column: 11; grid-row: 11; }
        .cell:nth-child(22) { grid-column: 10; grid-row: 11; }
        .cell:nth-child(23) { grid-column: 9;  grid-row: 11; }
        .cell:nth-child(24) { grid-column: 8;  grid-row: 11; }
        .cell:nth-child(25) { grid-column: 7;  grid-row: 11; }
        .cell:nth-child(26) { grid-column: 6;  grid-row: 11; }
        .cell:nth-child(27) { grid-column: 5;  grid-row: 11; }
        .cell:nth-child(28) { grid-column: 4;  grid-row: 11; }
        .cell:nth-child(29) { grid-column: 3;  grid-row: 11; }
        .cell:nth-child(30) { grid-column: 2;  grid-row: 11; }
        .cell:nth-child(31) { grid-column: 1;  grid-row: 11; }

        .cell:nth-child(32) { grid-column: 1;  grid-row: 10; }
        .cell:nth-child(33) { grid-column: 1;  grid-row: 9; }
        .cell:nth-child(34) { grid-column: 1;  grid-row: 8; }
        .cell:nth-child(35) { grid-column: 1;  grid-row: 7; }
        .cell:nth-child(36) { grid-column: 1;  grid-row: 6; }
        .cell:nth-child(37) { grid-column: 1;  grid-row: 5; }
        .cell:nth-child(38) { grid-column: 1;  grid-row: 4; }
        .cell:nth-child(39) { grid-column: 1;  grid-row: 3; }
        .cell:nth-child(40) { grid-column: 1;  grid-row: 2; }

        .right-column { display: flex; flex-direction: column; gap: 12px; }

        .btn-confirm {
            background-color: var(--accent-green);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            cursor: pointer;
        }

        .land-box {
            background: #fff;
            border: 3px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            flex: 1;
        }

        .btn-reset {
            background-color: #f59e0b;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            cursor: pointer;
        }

        /* 銀行頁面樣式 */
        .bank-container { display: flex; flex-direction: column; gap: 20px; }
        .bank-card {
            background: #fff;
            border: 3px solid var(--border-color);
            border-radius: 16px;
            padding: 20px 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .bank-title { font-size: 1.2rem; font-weight: bold; border-bottom: 2px solid #ccc; padding-bottom: 5px; }
        .bank-input-row { display: flex; align-items: center; gap: 15px; }
        .bank-input-row label { font-weight: bold; font-size: 1.05rem; }
        .bank-input-row input {
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 15px;
            font-size: 1.2rem;
            width: 160px;
            outline: none;
        }
        .btn-bank-action {
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 25px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .btn-borrow { background-color: var(--accent-green); }
        .btn-repay { background-color: var(--accent-orange); }
        .bank-status-row { display: flex; align-items: flex-end; gap: 40px; margin-top: 5px; }
        .debt-display-box .label { font-size: 0.95rem; font-weight: bold; color: #4b5563; }
        .debt-display-box .value { font-size: 2.2rem; font-weight: 800; color: var(--accent-green); }
        .timer-display-box .label { font-size: 0.95rem; font-weight: bold; color: #4b5563; }
        .timer-display-box .value { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); }
        .btn-bankrupt {
            background-color: #000;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px;
            border-radius: 20px;
            border: 3px solid var(--border-color);
            cursor: pointer;
            width: 100%;
            max-width: 400px;
        }

        /* 資助頁面樣式 */
        .subsidy-card {
            background: #fff;
            border: 3.5px solid var(--border-color);
            border-radius: 20px;
            padding: 20px 30px;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .subsidy-header { font-size: 1.3rem; font-weight: bold; border-bottom: 2px solid #333; padding-bottom: 8px; }
        .subsidy-row { display: flex; align-items: center; justify-content: space-between; }
        .subsidy-label { font-size: 1.25rem; font-weight: bold; width: 120px; }
        .btn-apply {
            background-color: var(--accent-green);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            padding: 6px 24px;
            border-radius: 20px;
            border: 2px solid var(--border-color);
            cursor: pointer;
        }
        .apply-count-text { font-size: 1.1rem; font-weight: bold; color: #1f2937; min-width: 120px; text-align: right; }

        /* 商店頁面樣式 */
        .shop-card {
            background: #fff;
            border: 3.5px solid var(--border-color);
            border-radius: 20px;
            padding: 20px 30px;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .shop-header { font-size: 1.3rem; font-weight: bold; border-bottom: 2px solid #333; padding-bottom: 8px; }
        .shop-subheader-row { display: flex; justify-content: flex-end; gap: 40px; font-size: 0.85rem; font-weight: bold; color: #4b5563; padding-right: 120px; }
        .shop-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .shop-item-info { width: 150px; }
        .shop-item-name { font-size: 1.25rem; font-weight: bold; }
        .shop-item-price { font-size: 0.85rem; color: #6b7280; font-weight: bold; }
        .btn-shop-buy {
            background-color: var(--accent-green);
            color: white;
            font-size: 0.95rem;
            font-weight: bold;
            padding: 5px 20px;
            border-radius: 20px;
            border: 2px solid var(--border-color);
            cursor: pointer;
        }
        .shop-count-box { font-size: 1.1rem; font-weight: bold; width: 60px; text-align: center; }
        .btn-shop-use {
            background-color: var(--accent-orange);
            color: white;
            font-size: 0.95rem;
            font-weight: bold;
            padding: 5px 24px;
            border-radius: 20px;
            border: 2px solid var(--border-color);
            cursor: pointer;
            width: 90px;
            text-align: center;
        }

        /* 分數頁面樣式 */
        .score-container { display: flex; flex-direction: column; gap: 15px; max-width: 750px; }
        .score-card {
            background: #fff;
            border: 3.5px solid var(--border-color);
            border-radius: 20px;
            padding: 15px 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .score-section-title { font-size: 1.15rem; font-weight: bold; border-bottom: 2px solid #ccc; padding-bottom: 5px; }
        .score-row { display: flex; align-items: center; gap: 12px; }
        .score-input {
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 15px;
            font-size: 1.2rem;
            width: 180px;
            outline: none;
            font-weight: bold;
        }
        .btn-score {
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 22px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .btn-score-add { background-color: var(--accent-green); }
        .btn-score-sub { background-color: var(--accent-red); }
        .btn-score-mod { background-color: var(--accent-orange); }
        .btn-score-yeah { background-color: var(--accent-orange); }
        .btn-tax {
            background-color: var(--accent-orange);
            color: white;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .pass-control-row { display: flex; align-items: center; justify-content: space-between; }
        .pass-left-group { display: flex; align-items: center; gap: 15px; }
        .pass-val-box { font-size: 2rem; font-weight: 800; width: 60px; text-align: center; }
        .btn-circle-arrow {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .btn-arrow-up { background-color: var(--accent-green); }
        .btn-arrow-down { background-color: var(--accent-red); }
        .btn-global-reset {
            background-color: #000;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 12px 40px;
            border-radius: 20px;
            border: 3px solid var(--border-color);
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-row">
        <div class="status-card">
            <div class="status-item">
                <div class="title">遊戲剩餘時間</div>
                <div class="value" id="game-timer-display">00:00:00</div>
            </div>
            <div class="status-item">
                <div class="title">現在時間</div>
                <div class="value" id="current-time">00:00:00</div>
            </div>
        </div>

        <div class="timer-control-card">
            <div class="input-group">
                <label>設定遊戲分鐘</label>
                <input type="number" id="input-minutes" value="120" min="1">
            </div>
            <div class="btn-group">
                <button class="btn btn-green" id="btn-start">開始</button>
                <button class="btn btn-orange" id="btn-pause">暫停</button>
                <button class="btn btn-red" id="btn-reset-timer">重新</button>
                <button class="btn btn-darkblue" id="btn-add-5">加時5分鐘</button>
            </div>
        </div>
    </div>

    <div class="player-bar">
        <div>玩家金額 <span class="val-green" id="ctrl-player-money">$0</span></div>
        <div>通行證數量 <span class="val-orange" id="ctrl-player-pass">1</span></div>
        <div>擁有道具 <span class="val-orange" id="ctrl-player-items">0</span></div>
        <div>擁有土地 <span class="val-orange" id="ctrl-player-lands">1</span></div>
    </div>

    <div class="main-layout">
        <div class="menu-panel">
            <button class="menu-btn active" data-page="board">棋盤</button>
            <button class="menu-btn" data-page="bank">銀行</button>
            <button class="menu-btn" data-page="subsidy">資助</button>
            <button class="menu-btn" data-page="shop">商店</button>
            <button class="menu-btn" data-page="score">分數</button>
        </div>

        <div>
            <div id="page-board" class="content-view active">
                <div class="board-layout">
                    <div class="board" id="game-board">
                        <div class="board-center"></div>
                    </div>
                    <div class="right-column">
                        <button class="btn-confirm" id="btn-confirm-pos">確定玩家位置</button>
                        <div class="land-box">
                            <div style="font-weight: bold; font-size: 0.95rem; margin-bottom: 6px;">已購買土地</div>
                            <hr style="border: none; border-top: 1px solid #ccc; margin-bottom: 10px;">
                            <div style="font-weight: bold; font-size: 1.1rem;">埃及</div>
                        </div>
                        <button class="btn-reset" id="btn-reset-pos">重設</button>
                    </div>
                </div>
            </div>

            <div id="page-bank" class="content-view">
                <div class="bank-container">
                    <div class="bank-card">
                        <div class="bank-title">借錢</div>
                        <div class="bank-input-row">
                            <label>輸入金額</label>
                            <input type="number" id="borrow-amount-input" placeholder="0">
                            <button class="btn-bank-action btn-borrow" id="btn-borrow-submit">借款</button>
                            <button class="btn-bank-action btn-repay" id="btn-repay-submit">還完</button>
                        </div>
                        <div class="bank-status-row">
                            <div class="debt-display-box">
                                <div class="label">還幾多 (含20%利息)</div>
                                <div class="value" id="bank-debt-display">$0</div>
                            </div>
                            <div class="timer-display-box">
                                <div class="label">還款倒計時</div>
                                <div class="value" id="bank-timer-display">00:00:00</div>
                            </div>
                        </div>
                    </div>
                    <button class="btn-bankrupt" id="btn-bankrupt">破產</button>
                </div>
            </div>

            <div id="page-subsidy" class="content-view">
                <div class="subsidy-card">
                    <div class="subsidy-header">資助</div>
                    <div class="subsidy-row">
                        <div class="subsidy-label">綜援</div>
                        <button class="btn-apply" id="btn-apply-cssa">申請</button>
                        <div class="apply-count-text">已申請 <span id="count-cssa">0</span> 次</div>
                    </div>
                    <div class="subsidy-row">
                        <div class="subsidy-label">全額津貼</div>
                        <button class="btn-apply" id="btn-apply-allowance">申請</button>
                        <div class="apply-count-text">已申請 <span id="count-allowance">0</span> 次</div>
                    </div>
                    <div class="subsidy-row">
                        <div class="subsidy-label">交通補貼</div>
                        <button class="btn-apply" id="btn-apply-transport">申請</button>
                        <div class="apply-count-text">已申請 <span id="count-transport">0</span> 次</div>
                    </div>
                </div>
            </div>

            <div id="page-shop" class="content-view">
                <div class="shop-card">
                    <div class="shop-header">道具</div>
                    <div class="shop-subheader-row">
                        <div>已購買</div>
                        <div>可使用</div>
                    </div>
                    <div class="shop-row">
                        <div class="shop-item-info">
                            <div class="shop-item-name">金骰子</div>
                            <div class="shop-item-price">$2000</div>
                        </div>
                        <button class="btn-shop-buy" id="btn-buy-dice">購買</button>
                        <div class="shop-count-box"><span id="purchased-dice">0</span> 次</div>
                        <div class="shop-count-box"><span id="usable-dice">0</span> 次</div>
                        <button class="btn-shop-use" id="btn-use-dice">使用</button>
                    </div>
                    <div class="shop-row">
                        <div class="shop-item-info">
                            <div class="shop-item-name">監獄解放卡</div>
                            <div class="shop-item-price">$1000</div>
                        </div>
                        <button class="btn-shop-buy" id="btn-buy-jail">購買</button>
                        <div class="shop-count-box"><span id="purchased-jail">0</span> 次</div>
                        <div class="shop-count-box"><span id="usable-jail">0</span> 次</div>
                        <button class="btn-shop-use" id="btn-use-jail">使用</button>
                    </div>
                    <div class="shop-row">
                        <div class="shop-item-info">
                            <div class="shop-item-name">隧道卡</div>
                            <div class="shop-item-price">$2000</div>
                        </div>
                        <button class="btn-shop-buy" id="btn-buy-tunnel">購買</button>
                        <div class="shop-count-box"><span id="purchased-tunnel">0</span> 次</div>
                        <div class="shop-count-box"><span id="usable-tunnel">0</span> 次</div>
                        <button class="btn-shop-use" id="btn-use-tunnel">使用</button>
                    </div>
                    <div class="shop-row">
                        <div class="shop-item-info">
                            <div class="shop-item-name">通行證</div>
                            <div class="shop-item-price">$6000</div>
                        </div>
                        <button class="btn-shop-buy" id="btn-buy-pass">購買</button>
                        <div style="width: 200px;"></div>
                    </div>
                </div>
            </div>

            <div id="page-score" class="content-view">
                <div class="score-container">
                    <div class="score-card">
                        <div class="score-section-title">金錢</div>
                        <div class="score-row">
                            <input type="number" id="score-money-input" class="score-input" placeholder="0">
                            <button class="btn-score btn-score-add" id="btn-money-add">加</button>
                            <button class="btn-score btn-score-sub" id="btn-money-sub">減</button>
                            <button class="btn-score btn-score-mod" id="btn-money-mod">改</button>
                            <button class="btn-score btn-score-yeah" id="btn-money-yeah">耶 (+$1000)</button>
                        </div>

                        <div class="score-section-title" style="margin-top: 5px;">交稅</div>
                        <div class="score-row">
                            <button class="btn-tax" id="btn-tax-1000">薪俸稅 (-$1000)</button>
                            <button class="btn-tax" id="btn-tax-500">薪俸稅 (-$500)</button>
                            <button class="btn-tax" id="btn-tax-10pct">薪俸稅 (-10%)</button>
                        </div>

                        <div class="score-section-title" style="margin-top: 5px;">Task 任務獎勵</div>
                        <div class="score-row">
                            <button class="btn-tax" style="background-color: #10b981;" id="btn-task-easy">普通 (+$1000)</button>
                            <button class="btn-tax" style="background-color: #3b82f6;" id="btn-task-mid">中等 (+$2500)</button>
                            <button class="btn-tax" style="background-color: #8b5cf6;" id="btn-task-hard">高級 (+$4000)</button>
                        </div>
                    </div>

                    <div class="score-card">
                        <div class="score-section-title">通行證</div>
                        <div class="pass-control-row">
                            <div class="pass-left-group">
                                <div class="pass-val-box" id="score-pass-val">01</div>
                                <button class="btn-circle-arrow btn-arrow-up" id="btn-pass-inc">↑</button>
                                <button class="btn-circle-arrow btn-arrow-down" id="btn-pass-dec">↓</button>
                            </div>
                            <button class="btn-global-reset" id="btn-global-reset">Reset</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, update, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAiEI_WuLV1va-mooABk6e5TmegK-45cAg",
        authDomain: "unitepoly-bb65a.firebaseapp.com",
        databaseURL: "https://unitepoly-bb65a-default-rtdb.firebaseio.com",
        projectId: "unitepoly-bb65a",
        storageBucket: "unitepoly-bb65a.firebasestorage.app",
        messagingSenderId: "1014615394934",
        appId: "1:1014615394934:web:26958994ec19e037742d57"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gameStateRef = ref(db, 'gameState');

    // 💡 40 個格子的指令圖片網址
    const tileImages = [
        'images/tile_0.png', 'images/tile_1.png', 'images/tile_2.png', 'images/tile_3.png',
        'images/tile_4.png', 'images/tile_5.png', 'images/tile_6.png', 'images/tile_7.png',
        'images/tile_8.png', 'images/tile_9.png', 'images/tile_10.png', 'images/tile_11.png',
        'images/tile_12.png', 'images/tile_13.png', 'images/tile_14.png', 'images/tile_15.png',
        'images/tile_16.png', 'images/tile_17.png', 'images/tile_18.png', 'images/tile_19.png',
        'images/tile_20.png', 'images/tile_21.png', 'images/tile_22.png', 'images/tile_23.png',
        'images/tile_24.png', 'images/tile_25.png', 'images/tile_26.png', 'images/tile_27.png',
        'images/tile_28.png', 'images/tile_29.png', 'images/tile_30.png', 'images/tile_31.png',
        'images/tile_32.png', 'images/tile_33.png', 'images/tile_34.png', 'images/tile_35.png',
        'images/tile_36.png', 'images/tile_37.png', 'images/tile_38.png', 'images/tile_39.png'
    ];

    let playerData = { money: 0, pass: 1, items: 0, lands: 1 };
    let itemsData = {
        dice: { purchased: 0, usable: 0, price: 2000 },
        jail: { purchased: 0, usable: 0, price: 1000 },
        tunnel: { purchased: 0, usable: 0, price: 2000 }
    };
    let bankData = { borrowed: 0, totalDebt: 0, debtTimerText: "00:00:00" };
    let subsidyCounts = { cssa: 0, allowance: 0, transport: 0 };

    let debtInterval = null;
    let debtSeconds = 30 * 60;

    function syncToFirebase(dataObj) {
        update(gameStateRef, dataObj).catch(err => console.error("Firebase 同步失敗:", err));
    }

    function formatTime(sec) {
        const h = String(Math.floor(sec / 3600)).padStart(2, '0');
        const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        return `${h}:${m}:${s}`;
    }

    // 選單頁面切換
    document.querySelectorAll('.menu-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const pageName = e.currentTarget.dataset.page;
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            e.currentTarget.classList.add('active');

            document.querySelectorAll('.content-view').forEach(view => view.classList.remove('active'));
            const targetView = document.getElementById(`page-${pageName}`);
            if (targetView) targetView.classList.add('active');
        });
    });

    // 建立 40 個格子並渲染圖片
    let selectedCellIndex = null;
    const board = document.getElementById('game-board');

    for (let i = 0; i < 40; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = i;
        
        if (tileImages[i]) {
            cell.style.backgroundImage = `url('${tileImages[i]}')`;
        }

        cell.addEventListener('click', () => {
            if (selectedCellIndex !== null) {
                const prevCell = board.querySelector(`[data-index='${selectedCellIndex}']`);
                if (prevCell) prevCell.classList.remove('selected');
            }
            selectedCellIndex = i;
            cell.classList.add('selected');
        });
        board.appendChild(cell);
    }

    // 監聽 Firebase 數據並實時更新 UI
    onValue(gameStateRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        if (data.player) {
            playerData = { ...playerData, ...data.player };
            document.getElementById('ctrl-player-money').textContent = `$${playerData.money}`;
            document.getElementById('ctrl-player-pass').textContent = playerData.pass;
            document.getElementById('ctrl-player-items').textContent = playerData.items;
            document.getElementById('ctrl-player-lands').textContent = playerData.lands;
            document.getElementById('score-pass-val').textContent = String(playerData.pass).padStart(2, '0');
        }

        if (data.items) {
            itemsData = { ...itemsData, ...data.items };
            document.getElementById('purchased-dice').textContent = itemsData.dice?.purchased || 0;
            document.getElementById('usable-dice').textContent = itemsData.dice?.usable || 0;
            document.getElementById('purchased-jail').textContent = itemsData.jail?.purchased || 0;
            document.getElementById('usable-jail').textContent = itemsData.jail?.usable || 0;
            document.getElementById('purchased-tunnel').textContent = itemsData.tunnel?.purchased || 0;
            document.getElementById('usable-tunnel').textContent = itemsData.tunnel?.usable || 0;
        }

        if (data.bank) {
            bankData = { ...bankData, ...data.bank };
            document.getElementById('bank-debt-display').textContent = `$${bankData.totalDebt || 0}`;
            document.getElementById('bank-timer-display').textContent = bankData.debtTimerText || "00:00:00";
        }

        if (data.subsidies) {
            subsidyCounts = { ...subsidyCounts, ...data.subsidies };
            document.getElementById('count-cssa').textContent = subsidyCounts.cssa || 0;
            document.getElementById('count-allowance').textContent = subsidyCounts.allowance || 0;
            document.getElementById('count-transport').textContent = subsidyCounts.transport || 0;
        }

        if (data.gameTimerText) {
            document.getElementById('game-timer-display').textContent = data.gameTimerText;
        }

        if (data.confirmedPosition !== undefined && data.confirmedPosition !== null) {
            if (selectedCellIndex !== null && selectedCellIndex !== data.confirmedPosition) {
                const prevCell = board.querySelector(`[data-index='${selectedCellIndex}']`);
                if (prevCell) prevCell.classList.remove('selected');
            }
            if (data.confirmedPosition >= 0) {
                selectedCellIndex = data.confirmedPosition;
                const cell = board.querySelector(`[data-index='${selectedCellIndex}']`);
                if (cell) cell.classList.add('selected');
            } else if (data.confirmedPosition === -1 && selectedCellIndex !== null) {
                const prevCell = board.querySelector(`[data-index='${selectedCellIndex}']`);
                if (prevCell) prevCell.classList.remove('selected');
                selectedCellIndex = null;
            }
        }
    });

    // 銀行邏輯
    function startDebtTimer() {
        if (debtInterval) clearInterval(debtInterval);
        debtInterval = setInterval(() => {
            if (debtSeconds > 0) {
                debtSeconds--;
                bankData.debtTimerText = formatTime(debtSeconds);
            } else {
                clearInterval(debtInterval);
                debtInterval = null;
                bankData.debtTimerText = "已逾期!";
            }
            document.getElementById('bank-timer-display').textContent = bankData.debtTimerText;
            syncToFirebase({ bank: bankData });
        }, 1000);
    }

    function stopDebtTimer() {
        if (debtInterval) {
            clearInterval(debtInterval);
            debtInterval = null;
        }
        debtSeconds = 30 * 60;
        bankData.debtTimerText = "00:00:00";
        document.getElementById('bank-timer-display').textContent = bankData.debtTimerText;
    }

    document.getElementById('btn-borrow-submit').addEventListener('click', () => {
        const amount = parseInt(document.getElementById('borrow-amount-input').value) || 0;
        if (amount <= 0) return alert("請輸入有效的借款金額！");
        playerData.money += amount;
        bankData.borrowed += amount;
        bankData.totalDebt = Math.floor(bankData.borrowed * 1.2);
        debtSeconds = 30 * 60;
        startDebtTimer();
        syncToFirebase({ player: playerData, bank: bankData });
        document.getElementById('borrow-amount-input').value = '';
    });

    document.getElementById('btn-repay-submit').addEventListener('click', () => {
        if (bankData.totalDebt <= 0) return alert("目前沒有債務！");
        if (playerData.money < bankData.totalDebt) return alert("玩家金額不足以還清債務！");
        playerData.money -= bankData.totalDebt;
        bankData.borrowed = 0;
        bankData.totalDebt = 0;
        stopDebtTimer();
        syncToFirebase({ player: playerData, bank: bankData });
    });

    document.getElementById('btn-bankrupt').addEventListener('click', () => {
        if (confirm("確定宣告破產？玩家金額將會清零，債務亦會解除！")) {
            playerData.money = 0;
            bankData.borrowed = 0;
            bankData.totalDebt = 0;
            stopDebtTimer();
            syncToFirebase({ player: playerData, bank: bankData });
        }
    });

    // 分數管理邏輯
    function getScoreInputVal() {
        const val = parseInt(document.getElementById('score-money-input').value);
        return isNaN(val) ? 0 : val;
    }

    document.getElementById('btn-money-add').addEventListener('click', () => { playerData.money += getScoreInputVal(); syncToFirebase({ player: playerData }); });
    document.getElementById('btn-money-sub').addEventListener('click', () => { playerData.money = Math.max(0, playerData.money - getScoreInputVal()); syncToFirebase({ player: playerData }); });
    document.getElementById('btn-money-mod').addEventListener('click', () => { playerData.money = Math.max(0, getScoreInputVal()); syncToFirebase({ player: playerData }); });
    document.getElementById('btn-money-yeah').addEventListener('click', () => { playerData.money += 1000; syncToFirebase({ player: playerData }); });

    document.getElementById('btn-tax-1000').addEventListener('click', () => { playerData.money = Math.max(0, playerData.money - 1000); syncToFirebase({ player: playerData }); });
    document.getElementById('btn-tax-500').addEventListener('click', () => { playerData.money = Math.max(0, playerData.money - 500); syncToFirebase({ player: playerData }); });
    document.getElementById('btn-tax-10pct').addEventListener('click', () => { playerData.money = Math.floor(playerData.money * 0.9); syncToFirebase({ player: playerData }); });

    document.getElementById('btn-task-easy').addEventListener('click', () => { playerData.money += 1000; syncToFirebase({ player: playerData }); });
    document.getElementById('btn-task-mid').addEventListener('click', () => { playerData.money += 2500; syncToFirebase({ player: playerData }); });
    document.getElementById('btn-task-hard').addEventListener('click', () => { playerData.money += 4000; syncToFirebase({ player: playerData }); });

    document.getElementById('btn-pass-inc').addEventListener('click', () => { playerData.pass += 1; syncToFirebase({ player: playerData }); });
    document.getElementById('btn-pass-dec').addEventListener('click', () => { if (playerData.pass > 0) playerData.pass -= 1; syncToFirebase({ player: playerData }); });

    document.getElementById('btn-global-reset').addEventListener('click', () => {
        if (confirm("確定要重設所有遊戲數據嗎？")) {
            stopDebtTimer();
            set(gameStateRef, {
                player: { money: 0, pass: 1, items: 0, lands: 1 },
                items: {
                    dice: { purchased: 0, usable: 0, price: 2000 },
                    jail: { purchased: 0, usable: 0, price: 1000 },
                    tunnel: { purchased: 0, usable: 0, price: 2000 }
                },
                bank: { borrowed: 0, totalDebt: 0, debtTimerText: "00:00:00" },
                subsidies: { cssa: 0, allowance: 0, transport: 0 },
                confirmedPosition: -1,
                gameTimerText: "02:00:00"
            });
        }
    });

    // 資助申請邏輯
    document.getElementById('btn-apply-cssa').addEventListener('click', () => {
        if (playerData.money >= 3000) return alert("不符合申請條件！資產需少於 $3000。");
        playerData.money += 1700;
        subsidyCounts.cssa += 1;
        syncToFirebase({ player: playerData, subsidies: subsidyCounts });
    });

    document.getElementById('btn-apply-allowance').addEventListener('click', () => {
        if (playerData.money >= 5000) return alert("不符合申請條件！資產需少於 $5000。");
        playerData.money += 1500;
        subsidyCounts.allowance += 1;
        syncToFirebase({ player: playerData, subsidies: subsidyCounts });
    });

    document.getElementById('btn-apply-transport').addEventListener('click', () => {
        playerData.money += 1000;
        subsidyCounts.transport += 1;
        syncToFirebase({ player: playerData, subsidies: subsidyCounts });
    });

    // 商店邏輯
    function updateShopState() {
        playerData.items = (itemsData.dice.usable || 0) + (itemsData.jail.usable || 0) + (itemsData.tunnel.usable || 0);
        syncToFirebase({ player: playerData, items: itemsData });
    }

    function buyItem(itemKey, addUsableCount) {
        const item = itemsData[itemKey];
        if (playerData.money < item.price) return alert(`金額不足！需要 $${item.price}`);
        playerData.money -= item.price;
        item.purchased = (item.purchased || 0) + 1;
        item.usable = (item.usable || 0) + addUsableCount;
        updateShopState();
    }

    function useItem(itemKey) {
        const item = itemsData[itemKey];
        if (!item.usable || item.usable <= 0) return alert("目前沒有可以使用的該道具！");
        item.usable -= 1;
        updateShopState();
    }

    document.getElementById('btn-buy-dice').addEventListener('click', () => buyItem('dice', 3));
    document.getElementById('btn-use-dice').addEventListener('click', () => useItem('dice'));
    document.getElementById('btn-buy-jail').addEventListener('click', () => buyItem('jail', 1));
    document.getElementById('btn-use-jail').addEventListener('click', () => useItem('jail'));
    document.getElementById('btn-buy-tunnel').addEventListener('click', () => buyItem('tunnel', 1));
    document.getElementById('btn-use-tunnel').addEventListener('click', () => useItem('tunnel'));
    document.getElementById('btn-buy-pass').addEventListener('click', () => {
        if (playerData.money < 6000) return alert("金額不足！需要 $6000");
        playerData.money -= 6000;
        playerData.pass += 1;
        syncToFirebase({ player: playerData });
    });

    // 棋盤定位邏輯
    document.getElementById('btn-confirm-pos').addEventListener('click', () => {
        if (selectedCellIndex === null) return alert("請先選擇一個棋盤格子！");
        syncToFirebase({ confirmedPosition: selectedCellIndex });
    });

    document.getElementById('btn-reset-pos').addEventListener('click', () => {
        if (selectedCellIndex !== null) {
            const currentCell = board.querySelector(`[data-index='${selectedCellIndex}']`);
            if (currentCell) currentCell.classList.remove('selected');
            selectedCellIndex = null;
        }
        syncToFirebase({ confirmedPosition: -1 });
    });

    // 時間邏輯
    let timerInterval = null;
    let totalSeconds = 120 * 60;

    function updateTimerDisplay() {
        const timeText = formatTime(totalSeconds);
        document.getElementById('game-timer-display').textContent = timeText;
        syncToFirebase({ gameTimerText: timeText });
    }

    document.getElementById('btn-start').addEventListener('click', () => {
        if (timerInterval) return;
        timerInterval = setInterval(() => {
            if (totalSeconds > 0) {
                totalSeconds--;
                updateTimerDisplay();
            } else {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }, 1000);
    });

    document.getElementById('btn-pause').addEventListener('click', () => {
        clearInterval(timerInterval);
        timerInterval = null;
    });

    document.getElementById('btn-reset-timer').addEventListener('click', () => {
        clearInterval(timerInterval);
        timerInterval = null;
        const inputMin = parseInt(document.getElementById('input-minutes').value) || 120;
        totalSeconds = inputMin * 60;
        updateTimerDisplay();
    });

    document.getElementById('btn-add-5').addEventListener('click', () => {
        totalSeconds += 5 * 60;
        updateTimerDisplay();
    });

    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('current-time').textContent = `${hours}:${minutes}:${seconds}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
    updateTimerDisplay();
</script>

</body>
</html>
