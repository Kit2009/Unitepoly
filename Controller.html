<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲控制器 (Controller)</title>
    <style>
        :root {
            --primary-bg: #f3f4f6;
            --card-bg: #ffffff;
            --border-color: #000000;
            --accent-blue: #2563eb;
            --accent-red: #ef4444;
            --accent-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            padding: 15px;
            color: #1f2937;
            max-width: 600px;
            margin: 0 auto;
        }

        h1, h2 { text-align: center; margin-bottom: 15px; }

        /* 分頁切換選單 */
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #e5e7eb;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #fff;
        }

        /* 內容區塊 */
        .page-content {
            display: none;
            background: var(--card-bg);
            border: 2.5px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .page-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            background: #e5e7eb;
            transition: background 0.2s;
            margin-top: 5px;
        }

        .btn-primary { background: var(--accent-blue); color: white; }
        .btn-danger { background: var(--accent-red); color: white; }
        .btn-success { background: var(--accent-green); color: white; }

        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <h1>🎮 遊戲 Controller</h1>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchPage('main-page')">主控制</button>
        <button class="tab-btn" onclick="switchPage('event-page')">突發事件</button>
        <button class="tab-btn" onclick="switchPage('media-page')">媒體控制</button>
    </div>

    <div id="main-page" class="page-content active">
        <h2>📍 玩家位置與數據</h2>
        
        <div class="form-group">
            <label>玩家棋盤位置 (0 - 39 格):</label>
            <input type="number" id="player-pos-input" min="0" max="39" value="0">
            <button class="btn btn-primary" onclick="updatePosition()">更新位置 (黃框)</button>
        </div>

        <hr style="margin: 15px 0;">

        <div class="form-group">
            <label>玩家金額 ($):</label>
            <input type="number" id="money-input" value="1000">
        </div>
        <div class="form-group">
            <label>通行證數量:</label>
            <input type="number" id="pass-input" value="0">
        </div>
        <button class="btn btn-success" onclick="updatePlayerStats()">更新玩家數據</button>
    </div>

    <div id="event-page" class="page-content">
        <h2>⚠️ 突發事件控制</h2>
        <p style="font-size: 0.85rem; color: #6b7280; margin-bottom: 12px;">觸發事件時會同步切換顯示屏內容。</p>

        <div class="form-group">
            <label>選擇突發事件類型:</label>
            <select id="event-type-select">
                <option value="typhoon">颱風警告</option>
                <option value="black-rain">黑雨警告</option>
                <option value="opportunity">幸運機會</option>
            </select>
        </div>

        <button class="btn btn-danger" onclick="triggerEvent()">📢 觸發突發事件</button>
        
        <button class="btn" style="margin-top: 15px; background: #fbbf24;" onclick="resolveEvent()">✅ 結束/清除突發事件</button>
    </div>

    <div id="media-page" class="page-content">
        <h2>🎬 媒體播放器連接</h2>
        
        <div class="form-group">
            <label>媒體類型:</label>
            <select id="media-type">
                <option value="video">影片 (Video)</option>
                <option value="image">圖片 (Image)</option>
                <option value="audio">背景音樂/音效 (Audio)</option>
            </select>
        </div>

        <div class="form-group">
            <label>媒體網址 (URL):</label>
            <input type="text" id="media-url" placeholder="https://example.com/video.mp4">
        </div>

        <button class="btn btn-primary" onclick="sendMedia()">▶️ 發送並播放媒體</button>
        <button class="btn btn-danger" onclick="stopMedia()" style="margin-top: 8px;">⏹️ 關閉顯示屏媒體</button>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ⚙️ 請貼上與 Display 相同的 Firebase 設定
    const firebaseConfig = {
        apiKey: "AIzaSyAiEI_WuLV1va-mooABk6e5TmegK-45cAg",
  authDomain: "unitepoly-bb65a.firebaseapp.com",
  databaseURL: "https://unitepoly-bb65a-default-rtdb.firebaseio.com",
  projectId: "unitepoly-bb65a",
  storageBucket: "unitepoly-bb65a.firebasestorage.app",
  messagingSenderId: "1014615394934",
  appId: "1:1014615394934:web:26958994ec19e037742d57"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 頁面切換邏輯 (修復卡死問題)
    window.switchPage = function(pageId) {
        document.querySelectorAll('.page-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(pageId).classList.add('active');
        event.currentTarget.classList.add('active');
    };

    // 1. 更新玩家黃框位置
    window.updatePosition = function() {
        const pos = parseInt(document.getElementById('player-pos-input').value) || 0;
        update(ref(db, 'gameState'), {
            confirmedPosition: pos
        }).then(() => alert(`位置已同步更新至第 ${pos} 格`));
    };

    // 2. 更新玩家金錢與通行證
    window.updatePlayerStats = function() {
        const money = parseInt(document.getElementById('money-input').value) || 0;
        const pass = parseInt(document.getElementById('pass-input').value) || 0;

        update(ref(db, 'gameState/player'), {
            money: money,
            pass: pass
        }).then(() => alert("玩家數據已更新"));
    };

    // 3. 觸發突發事件
    window.triggerEvent = function() {
        const eventType = document.getElementById('event-type-select').value;
        
        // 範例：發送對應突發事件的媒體與狀態
        update(ref(db, 'gameState'), {
            currentEvent: eventType,
            media: {
                type: 'image',
                url: 'https://via.placeholder.com/800x600?text=Event+' + eventType,
                loop: false
            }
        }).then(() => alert("突發事件已發送至 Display！"));
    };

    // 4. 清除突發事件 (防卡死)
    window.resolveEvent = function() {
        update(ref(db, 'gameState'), {
            currentEvent: null,
            'media/type': 'none'
        }).then(() => {
            alert("突發事件已解除");
            switchPage('main-page'); // 自動切換回主頁面
        });
    };

    // 5. 發送媒體指令至 Display
    window.sendMedia = function() {
        const type = document.getElementById('media-type').value;
        const url = document.getElementById('media-url').value;

        if (!url) {
            alert("請先輸入媒體網址 (URL)");
            return;
        }

        update(ref(db, 'gameState/media'), {
            type: type,
            url: url,
            loop: true
        }).then(() => alert("媒體已成功發送至 Display"));
    };

    // 6. 關閉媒體播放
    window.stopMedia = function() {
        update(ref(db, 'gameState/media'), {
            type: 'none'
        }).then(() => alert("已關閉 Display 媒體播放"));
    };
</script>

</body>
</html>
