<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲控制器 (Controller)</title>
    <style>
        :root {
            --primary-bg: #cdeaf7;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --border-color: #000;
            --text-dark: #1f2937;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --select-yellow: #facc15;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            background-image: radial-gradient(circle, #e0f2fe 0%, #bae6fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: var(--text-dark);
        }

        /* 📍 固定的整體外框 */
        .container {
            width: 100%;
            max-width: 1250px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 📌 1. 固定頂部時間欄 */
        .top-row {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 15px;
            height: 70px; /* 固定高度防止移位 */
        }

        .status-card {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 8px 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            border: 2px solid var(--border-color);
        }

        .status-item .title { font-size: 0.85rem; color: #4b5563; }
        .status-item .value { font-size: 1.8rem; font-weight: bold; }

        .timer-control-card {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border: 2px solid var(--border-color);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-group label { font-size: 0.75rem; font-weight: bold; }
        .input-group input {
            width: 70px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border: 2px solid #9ca3af;
            border-radius: 8px;
            padding: 2px;
        }

        .btn-group { display: flex; gap: 6px; }
        .btn {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-green { background-color: var(--accent-green); }
        .btn-orange { background-color: var(--accent-orange); }
        .btn-red { background-color: var(--accent-red); }
        .btn-darkblue { background-color: #1e3a8a; }

        /* 📌 2. 固定玩家數據欄 */
        .player-bar {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid var(--border-color);
            height: 50px; /* 固定高度防止移位 */
        }

        .val-green { color: var(--accent-green); font-size: 1.3em; font-weight: 800; }
        .val-orange { color: var(--accent-orange); font-size: 1.2em; font-weight: 800; }

        /* 📌 3. 下方主要操作分頁區 */
        .main-layout {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 15px;
            min-height: 550px; /* 固定高度確保切換時不跳動 */
        }

        /* 左側選單 */
        .menu-panel {
            background: #fff;
            border: 3px solid var(--border-color);
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: fit-content;
        }

        .menu-btn {
            background: #e0f2fe;
            border: 2px solid #38bdf8;
            color: #0369a1;
            font-size: 1.05rem;
            font-weight: bold;
            padding: 10px 0;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
        }

        .menu-btn.active {
            background: var(--accent-green);
            color: white;
            border-color: var(--border-color);
        }

        /* 切換分頁通用容器 */
        .content-view {
            width: 100%;
            display: none;
        }

        .content-view.active {
            display: block;
        }

        /* ------------------ PAGE 1: 棋盤 ------------------ */
        .board-layout {
            display: grid;
            grid-template-columns: minmax(350px, 1.4fr) 280px;
            gap: 15px;
        }

        .board {
            background: #fff;
            border: 3.5px solid var(--border-color);
            border-radius: 18px;
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(11, 1fr);
            padding: 5px;
            gap: 3px;
            width: 100%;
        }

        .board-center {
            grid-column: 2 / 11;
            grid-row: 2 / 11;
            background-image: url('center-image.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            border: 1px dashed #ccc;
        }

        .cell {
            border: 2px solid var(--border-color);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cell.selected {
            border: 4px solid var(--select-yellow) !important;
            box-shadow: 0 0 8px rgba(250, 204, 21, 0.8);
            z-index: 10;
        }

        .cell:nth-child(1)  { grid-column: 1;  grid-row: 1; }
        .cell:nth-child(2)  { grid-column: 2;  grid-row: 1; }
        .cell:nth-child(3)  { grid-column: 3;  grid-row: 1; }
        .cell:nth-child(4)  { grid-column: 4;  grid-row: 1; }
        .cell:nth-child(5)  { grid-column: 5;  grid-row: 1; }
        .cell:nth-child(6)  { grid-column: 6;  grid-row: 1; }
        .cell:nth-child(7)  { grid-column: 7;  grid-row: 1; }
        .cell:nth-child(8)  { grid-column: 8;  grid-row: 1; }
        .cell:nth-child(9)  { grid-column: 9;  grid-row: 1; }
        .cell:nth-child(10) { grid-column: 10; grid-row: 1; }
        .cell:nth-child(11) { grid-column: 11; grid-row: 1; }

        .cell:nth-child(12) { grid-column: 11; grid-row: 2; }
        .cell:nth-child(13) { grid-column: 11; grid-row: 3; }
        .cell:nth-child(14) { grid-column: 11; grid-row: 4; }
        .cell:nth-child(15) { grid-column: 11; grid-row: 5; }
        .cell:nth-child(16) { grid-column: 11; grid-row: 6; }
        .cell:nth-child(17) { grid-column: 11; grid-row: 7; }
        .cell:nth-child(18) { grid-column: 11; grid-row: 8; }
        .cell:nth-child(19) { grid-column: 11; grid-row: 9; }
        .cell:nth-child(20) { grid-column: 11; grid-row: 10; }

        .cell:nth-child(21) { grid-column: 11; grid-row: 11; }
        .cell:nth-child(22) { grid-column: 10; grid-row: 11; }
        .cell:nth-child(23) { grid-column: 9;  grid-row: 11; }
        .cell:nth-child(24) { grid-column: 8;  grid-row: 11; }
        .cell:nth-child(25) { grid-column: 7;  grid-row: 11; }
        .cell:nth-child(26) { grid-column: 6;  grid-row: 11; }
        .cell:nth-child(27) { grid-column: 5;  grid-row: 11; }
        .cell:nth-child(28) { grid-column: 4;  grid-row: 11; }
        .cell:nth-child(29) { grid-column: 3;  grid-row: 11; }
        .cell:nth-child(30) { grid-column: 2;  grid-row: 11; }
        .cell:nth-child(31) { grid-column: 1;  grid-row: 11; }

        .cell:nth-child(32) { grid-column: 1;  grid-row: 10; }
        .cell:nth-child(33) { grid-column: 1;  grid-row: 9; }
        .cell:nth-child(34) { grid-column: 1;  grid-row: 8; }
        .cell:nth-child(35) { grid-column: 1;  grid-row: 7; }
        .cell:nth-child(36) { grid-column: 1;  grid-row: 6; }
        .cell:nth-child(37) { grid-column: 1;  grid-row: 5; }
        .cell:nth-child(38) { grid-column: 1;  grid-row: 4; }
        .cell:nth-child(39) { grid-column: 1;  grid-row: 3; }
        .cell:nth-child(40) { grid-column: 1;  grid-row: 2; }

        .right-column { display: flex; flex-direction: column; gap: 12px; }

        .btn-confirm {
            background-color: var(--accent-green);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            cursor: pointer;
        }

        .land-box {
            background: #fff;
            border: 3px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            flex: 1;
        }

        .btn-reset {
            background-color: #f59e0b;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            cursor: pointer;
        }

        /* ------------------ PAGE 2: 銀行 ------------------ */
        .bank-container { display: flex; flex-direction: column; gap: 20px; }
        .bank-card {
            background: #fff;
            border: 3px solid var(--border-color);
            border-radius: 16px;
            padding: 20px 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .bank-title { font-size: 1.2rem; font-weight: bold; border-bottom: 2px solid #ccc; padding-bottom: 5px; }
        .bank-input-row { display: flex; align-items: center; gap: 15px; }
        .bank-input-row label { font-weight: bold; font-size: 1.05rem; }
        .bank-input-row input {
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 15px;
            font-size: 1.2rem;
            width: 160px;
            outline: none;
        }
        .btn-bank-action {
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 25px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .btn-borrow { background-color: var(--accent-green); }
        .btn-repay { background-color: var(--accent-orange); }
        .bank-status-row { display: flex; align-items: flex-end; gap: 40px; margin-top: 5px; }
        .debt-display-box .label { font-size: 0.95rem; font-weight: bold; color: #4b5563; }
        .debt-display-box .value { font-size: 2.2rem; font-weight: 800; color: var(--accent-green); }
        .timer-display-box .label { font-size: 0.95rem; font-weight: bold; color: #4b5563; }
        .timer-display-box .value { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); }
        .btn-bankrupt {
            background-color: #000;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px;
            border-radius: 20px;
            border: 3px solid var(--border-color);
            cursor: pointer;
            width: 100%;
            max-width: 400px;
        }

        /* ------------------ 🎁 PAGE 4: 資助 ------------------ */
        .subsidy-card {
            background: #fff;
            border: 3.5px solid var(--border-color);
            border-radius: 20px;
            padding: 20px 30px;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .subsidy-header {
            font-size: 1.3rem;
            font-weight: bold;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
        }

        .subsidy-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .subsidy-label {
            font-size: 1.25rem;
            font-weight: bold;
            width: 120px;
        }

        .btn-apply {
            background-color: var(--accent-green);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            padding: 6px 24px;
            border-radius: 20px;
            border: 2px solid var(--border-color);
            cursor: pointer;
        }

        .apply-count-text {
            font-size: 1.1rem;
            font-weight: bold;
            color: #1f2937;
            min-width: 120px;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-row">
        <div class="status-card">
            <div class="status-item">
                <div class="title">遊戲剩餘時間</div>
                <div class="value" id="game-timer-display">00:00:00</div>
            </div>
            <div class="status-item">
                <div class="title">現在時間</div>
                <div class="value" id="current-time">00:00:00</div>
            </div>
        </div>

        <div class="timer-control-card">
            <div class="input-group">
                <label>設定遊戲分鐘</label>
                <input type="number" id="input-minutes" value="120" min="1">
            </div>
            <div class="btn-group">
                <button class="btn btn-green" id="btn-start">開始</button>
                <button class="btn btn-orange" id="btn-pause">暫停</button>
                <button class="btn btn-red" id="btn-reset-timer">重新</button>
                <button class="btn btn-darkblue" id="btn-add-5">加時5分鐘</button>
            </div>
        </div>
    </div>

    <div class="player-bar">
        <div>玩家金額 <span class="val-green" id="ctrl-player-money">$0</span></div>
        <div>通行證數量 <span class="val-orange" id="ctrl-player-pass">1</span></div>
        <div>擁有道具 <span class="val-orange" id="ctrl-player-items">1</span></div>
        <div>擁有土地 <span class="val-orange" id="ctrl-player-lands">1</span></div>
    </div>

    <div class="main-layout">
        <div class="menu-panel">
            <button class="menu-btn active" onclick="switchPage('board')">棋盤</button>
            <button class="menu-btn" onclick="switchPage('bank')">銀行</button>
            <button class="menu-btn" onclick="switchPage('house')">樓房</button>
            <button class="menu-btn" onclick="switchPage('subsidy')">資助</button>
            <button class="menu-btn" onclick="switchPage('shop')">商店</button>
            <button class="menu-btn" onclick="switchPage('event')">突發</button>
            <button class="menu-btn" onclick="switchPage('score')">分數</button>
        </div>

        <div>
            <div id="page-board" class="content-view active">
                <div class="board-layout">
                    <div class="board" id="game-board">
                        <div class="board-center"></div>
                    </div>
                    <div class="right-column">
                        <button class="btn-confirm" id="btn-confirm-pos">確定玩家位置</button>
                        <div class="land-box">
                            <div style="font-weight: bold; font-size: 0.95rem; margin-bottom: 6px;">已購買土地</div>
                            <hr style="border: none; border-top: 1px solid #ccc; margin-bottom: 10px;">
                            <div style="font-weight: bold; font-size: 1.1rem;">埃及</div>
                        </div>
                        <button class="btn-reset" id="btn-reset-pos">重設</button>
                    </div>
                </div>
            </div>

            <div id="page-bank" class="content-view">
                <div class="bank-container">
                    <div class="bank-card">
                        <div class="bank-title">借錢</div>
                        <div class="bank-input-row">
                            <label>輸入金額</label>
                            <input type="number" id="borrow-amount-input" placeholder="0">
                            <button class="btn-bank-action btn-borrow" id="btn-borrow-submit">輸入</button>
                            <button class="btn-bank-action btn-repay" id="btn-repay-submit">還完</button>
                        </div>
                        <div class="bank-status-row">
                            <div class="debt-display-box">
                                <div class="label">還幾多</div>
                                <div class="value" id="bank-debt-display">$00000</div>
                            </div>
                            <div class="timer-display-box">
                                <div class="label">倒計時</div>
                                <div class="value" id="bank-timer-display">00:00:00</div>
                            </div>
                        </div>
                    </div>

                    <button class="btn-bankrupt" id="btn-bankrupt">破產</button>
                </div>
            </div>

            <div id="page-subsidy" class="content-view">
                <div class="subsidy-card">
                    <div class="subsidy-header">資助</div>

                    <div class="subsidy-row">
                        <div class="subsidy-label">綜援</div>
                        <button class="btn-apply" id="btn-apply-cssa">申請</button>
                        <div class="apply-count-text">已申請 <span id="count-cssa">0</span> 次</div>
                    </div>

                    <div class="subsidy-row">
                        <div class="subsidy-label">全額津貼</div>
                        <button class="btn-apply" id="btn-apply-allowance">申請</button>
                        <div class="apply-count-text">已申請 <span id="count-allowance">0</span> 次</div>
                    </div>

                    <div class="subsidy-row">
                        <div class="subsidy-label">交通補貼</div>
                        <button class="btn-apply" id="btn-apply-transport">申請</button>
                        <div class="apply-count-text">已申請 <span id="count-transport">0</span> 次</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAiEI_WuLV1va-mooABk6e5TmegK-45cAg",
  authDomain: "unitepoly-bb65a.firebaseapp.com",
  databaseURL: "https://unitepoly-bb65a-default-rtdb.firebaseio.com",
  projectId: "unitepoly-bb65a",
  storageBucket: "unitepoly-bb65a.firebasestorage.app",
  messagingSenderId: "1014615394934",
  appId: "1:1014615394934:web:26958994ec19e037742d57"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gameStateRef = ref(db, 'gameState');

    // 玩家數據
    let playerData = { money: 0, pass: 1, items: 1, lands: 1 };

    // 資助申請次數
    let subsidyCounts = { cssa: 0, allowance: 0, transport: 0 };

    function syncToFirebase(dataObj) {
        update(gameStateRef, dataObj).catch(err => console.error("Firebase 同步失敗:", err));
    }

    // 監聽 Firebase 更新
    onValue(gameStateRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        if (data.player) {
            playerData = data.player;
            document.getElementById('ctrl-player-money').textContent = `$${playerData.money}`;
            document.getElementById('ctrl-player-pass').textContent = playerData.pass;
            document.getElementById('ctrl-player-items').textContent = playerData.items;
            document.getElementById('ctrl-player-lands').textContent = playerData.lands;
        }

        if (data.subsidies) {
            subsidyCounts = data.subsidies;
            document.getElementById('count-cssa').textContent = subsidyCounts.cssa;
            document.getElementById('count-allowance').textContent = subsidyCounts.allowance;
            document.getElementById('count-transport').textContent = subsidyCounts.transport;
        }
    });

    // --- 1. 分頁切換 ---
    window.switchPage = function(pageName) {
        document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');

        document.querySelectorAll('.content-view').forEach(view => view.classList.remove('active'));
        const targetView = document.getElementById(`page-${pageName}`);
        if (targetView) targetView.classList.add('active');
    };

    // --- 2. 資助申請邏輯 ---
    // 綜援 (資產 < 3000 -> +1700)
    document.getElementById('btn-apply-cssa').addEventListener('click', () => {
        if (playerData.money >= 3000) {
            alert("不符合申請條件！資產需少於 $3000。");
            return;
        }
        playerData.money += 1700;
        subsidyCounts.cssa += 1;
        syncToFirebase({ player: playerData, subsidies: subsidyCounts });
    });

    // 全額津貼 (資產 < 5000 -> +1500)
    document.getElementById('btn-apply-allowance').addEventListener('click', () => {
        if (playerData.money >= 5000) {
            alert("不符合申請條件！資產需少於 $5000。");
            return;
        }
        playerData.money += 1500;
        subsidyCounts.allowance += 1;
        syncToFirebase({ player: playerData, subsidies: subsidyCounts });
    });

    // 交通補貼 (無限制 -> +1000)
    document.getElementById('btn-apply-transport').addEventListener('click', () => {
        playerData.money += 1000;
        subsidyCounts.transport += 1;
        syncToFirebase({ player: playerData, subsidies: subsidyCounts });
    });

    // --- 3. 棋盤繪製邏輯 ---
    let selectedCellIndex = null;
    const board = document.getElementById('game-board');

    for (let i = 0; i < 40; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = i;
        cell.addEventListener('click', () => {
            if (selectedCellIndex !== null) {
                const prevCell = board.querySelector(`[data-index='${selectedCellIndex}']`);
                if (prevCell) prevCell.classList.remove('selected');
            }
            selectedCellIndex = i;
            cell.classList.add('selected');
        });
        board.appendChild(cell);
    }

    document.getElementById('btn-confirm-pos').addEventListener('click', () => {
        if (selectedCellIndex === null) return alert("請先選擇一個棋盤格子！");
        syncToFirebase({ confirmedPosition: selectedCellIndex });
    });

    document.getElementById('btn-reset-pos').addEventListener('click', () => {
        if (selectedCellIndex !== null) {
            const currentCell = board.querySelector(`[data-index='${selectedCellIndex}']`);
            if (currentCell) currentCell.classList.remove('selected');
            selectedCellIndex = null;
        }
        syncToFirebase({ confirmedPosition: -1 });
    });

    // --- 4. 時間與倒計時邏輯 ---
    function formatTime(sec) {
        const h = String(Math.floor(sec / 3600)).padStart(2, '0');
        const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        return `${h}:${m}:${s}`;
    }

    let timerInterval = null;
    let totalSeconds = 120 * 60;

    function updateTimerDisplay() {
        const timeText = formatTime(totalSeconds);
        document.getElementById('game-timer-display').textContent = timeText;
        syncToFirebase({ gameTimerText: timeText });
    }

    document.getElementById('btn-start').addEventListener('click', () => {
        if (timerInterval) return;
        timerInterval = setInterval(() => {
            if (totalSeconds > 0) {
                totalSeconds--;
                updateTimerDisplay();
            } else {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }, 1000);
    });

    document.getElementById('btn-pause').addEventListener('click', () => {
        clearInterval(timerInterval);
        timerInterval = null;
    });

    document.getElementById('btn-reset-timer').addEventListener('click', () => {
        clearInterval(timerInterval);
        timerInterval = null;
        const inputMin = parseInt(document.getElementById('input-minutes').value) || 120;
        totalSeconds = inputMin * 60;
        updateTimerDisplay();
    });

    document.getElementById('btn-add-5').addEventListener('click', () => {
        totalSeconds += 5 * 60;
        updateTimerDisplay();
    });

    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('current-time').textContent = `${hours}:${minutes}:${seconds}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
    updateTimerDisplay();
</script>

</body>
</html>
